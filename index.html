<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="同盟战功统计看板：每日导入 CSV 战报，查看同盟成员当日排行、人员变动、周度与累计数据，按门阀分类统计战功、贡献与助攻。">
  <title>同盟战功统计看板 · 九天揽月楼</title>
  <style>
/* ============ 基础 ============ */
:root {
  --ink: #0a0a0a;
  --ink-2: #100d0a;
  --surface: #1c1712;
  --surface-2: #241c15;
  --surface-3: #2c231a;
  --gold: #c8aa6f;
  --gold-light: #e9d4a5;
  --gold-dark: #8c7654;
  --rice: #e8dcc8;
  --rice-2: #c9bca6;
  --muted: #948873;
  --cinnabar: #c23838;
  --cinnabar-2: #e0604f;
  --jade: #5f8f6d;
  --jade-2: #86b394;
  --blue: #6f93b8;
  --line: rgba(200, 170, 111, 0.16);
  --line-strong: rgba(200, 170, 111, 0.32);
  --font-ancient: "STKaiti", "KaiTi", "Kaiti SC", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", Georgia, serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.9);
  --radius: 4px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  overflow-x: hidden;
  min-height: 100vh;
  background:
    radial-gradient(900px 520px at 82% -8%, rgba(200, 170, 111, 0.075), transparent 62%),
    radial-gradient(700px 440px at -12% 102%, rgba(194, 56, 56, 0.055), transparent 62%),
    var(--ink);
  color: var(--rice);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.5;
  background-image:
    repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.008) 0 1px, transparent 1px 11px);
}
a { color: var(--gold-light); text-decoration: none; }
a:hover { color: var(--gold); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
img { max-width: 100%; }
::selection { background: rgba(200, 170, 111, 0.3); color: #fff; }
:focus-visible { outline: 2px solid rgba(200, 170, 111, 0.6); outline-offset: 2px; }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
::-webkit-scrollbar-thumb { background: rgba(200, 170, 111, 0.22); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: rgba(200, 170, 111, 0.36); }

.gold-text {
  background: linear-gradient(180deg, #f4e3bb 0%, #d6b87c 52%, #a98750 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.num, .tabular { font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.gold { color: var(--gold); }
.cinnabar { color: var(--cinnabar-2); }
.jade { color: var(--jade-2); }
.right { text-align: right; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.hide { display: none !important; }
.link { color: var(--gold-light); border-bottom: 1px solid rgba(200, 170, 111, 0.3); }
.link:hover { border-color: var(--gold); }
.divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line-strong), transparent); margin: 14px 0; }
.row { display: flex; align-items: center; gap: 8px; }
.row--between { justify-content: space-between; }
.row--wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.icon { display: inline-block; vertical-align: -3px; flex: none; }

/* ============ 布局 ============ */
.app { min-height: 100vh; }
.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 230px;
  display: flex;
  flex-direction: column;
  padding: 20px 14px 16px;
  background: linear-gradient(180deg, rgba(36, 29, 22, 0.96), rgba(12, 10, 8, 0.98));
  border-right: 1px solid var(--line);
  z-index: 40;
}
.sidebar::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, rgba(233, 212, 165, 0.85), rgba(200, 170, 111, 0.2), transparent);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.brand__mark {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 3px;
  background: linear-gradient(145deg, #f0dcb0, #c8aa6f 55%, #8c6a36);
  color: #1b140c;
  font-family: var(--font-ancient);
  font-size: 22px;
  font-weight: 700;
  box-shadow: 0 6px 18px -6px rgba(200, 170, 111, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
}
.brand__name { display: block; font-family: var(--font-ancient); font-size: 19px; letter-spacing: 1px; line-height: 1.2; }
.brand__sub { display: block; font-size: 10px; letter-spacing: 4px; color: var(--gold-dark); margin-top: 1px; }
.side-nav { display: flex; flex-direction: column; gap: 3px; margin-top: 20px; }
.side-link {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px;
  border-radius: 3px;
  border-left: 2px solid transparent;
  color: var(--muted);
  font-size: 13.5px;
  transition: background 0.18s, color 0.18s;
}
.side-link:hover { background: rgba(200, 170, 111, 0.06); color: var(--rice); }
.side-link.is-active {
  background: rgba(200, 170, 111, 0.12);
  border-left-color: var(--gold);
  color: var(--gold-light);
}
.side-link .icon { opacity: 0.9; }
.side-foot { margin-top: auto; }
.date-card {
  border: 1px solid var(--line);
  background: linear-gradient(160deg, rgba(44, 35, 26, 0.6), rgba(18, 15, 12, 0.6));
  border-radius: var(--radius);
  padding: 11px 13px;
}
.date-card__label { font-family: var(--font-ancient); font-size: 11px; letter-spacing: 3px; color: var(--muted); }
.date-card__value { font-family: var(--font-ancient); font-size: 17px; color: var(--gold-light); margin-top: 3px; }
.date-card__sub { font-size: 10px; color: var(--gold-dark); margin-top: 2px; }
.side-note { margin-top: 10px; font-size: 10px; color: rgba(148, 136, 115, 0.65); text-align: center; letter-spacing: 1px; }

.main { margin-left: 230px; min-width: 0; }
.view { max-width: 1380px; margin: 0 auto; padding: 26px 28px 46px; }
.topbar { display: none; }
.tabbar { display: none; }

/* ============ 页头 ============ */
.page-head { display: flex; align-items: flex-start; gap: 13px; margin-bottom: 18px; }
.page-head__main { flex: 1 1 0; min-width: 0; }
.page-head__icon {
  width: 42px; height: 42px; flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  background: rgba(200, 170, 111, 0.08);
  color: var(--gold);
  margin-top: 2px;
}
.page-head__title { font-family: var(--font-ancient); font-size: 25px; line-height: 1.25; letter-spacing: 1px; }
.page-head__sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.page-head__actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.page-head__meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.back-link:hover { color: var(--gold); }

/* ============ 卡片 ============ */
.card {
  position: relative;
  background: linear-gradient(158deg, rgba(40, 32, 24, 0.82), rgba(20, 16, 13, 0.86));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.025);
}
.card--flat { box-shadow: none; background: rgba(22, 18, 14, 0.55); }
.card--ornate::before, .card--ornate::after {
  content: "";
  position: absolute;
  width: 12px; height: 12px;
  pointer-events: none;
  border-color: rgba(200, 170, 111, 0.55);
  border-style: solid;
}
.card--ornate::before { top: 5px; left: 5px; border-width: 1px 0 0 1px; }
.card--ornate::after { right: 5px; bottom: 5px; border-width: 0 1px 1px 0; }
.card__head { display: flex; align-items: center; gap: 9px; margin-bottom: 13px; flex-wrap: wrap; }
.card__icon {
  width: 26px; height: 26px; flex: none;
  display: grid; place-items: center;
  border-radius: 3px;
  background: rgba(200, 170, 111, 0.13);
  color: var(--gold);
}
.card__icon--jade { background: rgba(95, 143, 109, 0.16); color: var(--jade-2); }
.card__icon--red { background: rgba(194, 56, 56, 0.14); color: var(--cinnabar-2); }
.card__icon--blue { background: rgba(111, 147, 184, 0.15); color: var(--blue); }
.card__title { font-family: var(--font-ancient); font-size: 15.5px; color: var(--gold); letter-spacing: 0.5px; }
.card__sub { font-size: 11px; color: var(--muted); }
.card__actions { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card__body { min-width: 0; }
.card__foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(200, 170, 111, 0.1); }

/* ============ 按钮 / 表单 ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px;
  padding: 0 14px;
  border-radius: 3px;
  border: 1px solid var(--line-strong);
  background: rgba(200, 170, 111, 0.04);
  color: var(--gold-light);
  font-size: 13px;
  line-height: 1;
  white-space: nowrap;
  transition: background 0.16s, border-color 0.16s, color 0.16s, transform 0.16s;
}
.btn:hover { background: rgba(200, 170, 111, 0.1); border-color: rgba(200, 170, 111, 0.5); color: #fff2d8; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn--gold {
  background: linear-gradient(140deg, #efd9a9, #c8aa6f 55%, #a27f45);
  border-color: rgba(240, 220, 176, 0.65);
  color: #1a130b;
  font-weight: 600;
  box-shadow: 0 8px 20px -12px rgba(200, 170, 111, 0.7);
}
.btn--gold:hover { background: linear-gradient(140deg, #f7e5bc, #d5b87f 55%, #b08a4e); color: #150f08; }
.btn--danger { border-color: rgba(194, 56, 56, 0.5); color: var(--cinnabar-2); background: rgba(194, 56, 56, 0.06); }
.btn--danger:hover { background: rgba(194, 56, 56, 0.14); border-color: var(--cinnabar); color: #ffd9d0; }
.btn--ghost { border-color: var(--line); color: var(--rice-2); background: transparent; }
.btn--ghost:hover { color: var(--gold-light); }
.btn--sm { min-height: 30px; padding: 0 10px; font-size: 12px; }
.btn--xs { min-height: 26px; padding: 0 8px; font-size: 11px; }
.btn--block { width: 100%; }
.icon-btn {
  width: 36px; height: 36px;
  display: inline-grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: transparent;
  color: var(--gold-light);
}
.icon-btn:hover { background: rgba(200, 170, 111, 0.1); border-color: var(--line-strong); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field__label { font-size: 11px; color: var(--muted); letter-spacing: 0.4px; }
.field__hint { font-size: 11px; color: var(--gold-dark); }
.field__error { font-size: 11px; color: var(--cinnabar-2); }
.input, .select, .textarea {
  width: 100%;
  height: 40px;
  padding: 0 11px;
  background: rgba(8, 7, 6, 0.62);
  border: 1px solid rgba(200, 170, 111, 0.24);
  border-radius: 3px;
  color: var(--rice);
  font-size: 13px;
  outline: none;
  transition: border-color 0.16s, box-shadow 0.16s;
}
.textarea { height: auto; min-height: 80px; padding: 9px 11px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200, 170, 111, 0.1); }
.input::placeholder, .textarea::placeholder { color: #6f6656; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #b7a077 50%), linear-gradient(135deg, #b7a077 50%, transparent 50%); background-position: calc(100% - 15px) 17px, calc(100% - 10px) 17px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.search-wrap { position: relative; }
.search-wrap .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--gold-dark); pointer-events: none; }
.search-wrap .input { padding-left: 34px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.form-grid .span-2 { grid-column: 1 / -1; }
.check { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--rice-2); }
.check input { accent-color: #c8aa6f; }
.range-row { display: flex; align-items: center; gap: 12px; }
.range-row input[type="range"] { flex: 1; accent-color: #c8aa6f; }
.range-row .input { width: 74px; text-align: center; }

/* ============ 顶部提示 / 徽标 ============ */
.notice {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: rgba(200, 170, 111, 0.06);
  font-size: 12.5px;
  line-height: 1.55;
}
.notice__icon { color: var(--gold); margin-top: 2px; flex: none; }
.notice--jade { border-color: rgba(95, 143, 109, 0.35); background: rgba(95, 143, 109, 0.08); }
.notice--jade .notice__icon { color: var(--jade-2); }
.notice--blue { border-color: rgba(111, 147, 184, 0.35); background: rgba(111, 147, 184, 0.08); }
.notice--blue .notice__icon { color: var(--blue); }
.notice--red { border-color: rgba(194, 56, 56, 0.4); background: rgba(194, 56, 56, 0.08); }
.notice--red .notice__icon { color: var(--cinnabar-2); }
.notice__action { margin-left: auto; flex: none; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px;
  padding: 0 7px;
  border: 1px solid rgba(200, 170, 111, 0.3);
  border-radius: 2px;
  background: rgba(200, 170, 111, 0.08);
  color: var(--gold-light);
  font-size: 10.5px;
  line-height: 1;
  white-space: nowrap;
}
.badge--sm { height: 18px; padding: 0 5px; font-size: 9.5px; }
.badge--jade { border-color: rgba(95, 143, 109, 0.45); background: rgba(95, 143, 109, 0.11); color: var(--jade-2); }
.badge--blue { border-color: rgba(111, 147, 184, 0.45); background: rgba(111, 147, 184, 0.11); color: #a9c6e2; }
.badge--gold { border-color: rgba(200, 170, 111, 0.45); background: rgba(200, 170, 111, 0.1); color: var(--gold-light); }
.badge--red { border-color: rgba(194, 56, 56, 0.45); background: rgba(194, 56, 56, 0.1); color: #e79c8e; }
.badge--muted { border-color: rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03); color: var(--muted); }
.tag {
  display: inline-flex; align-items: center;
  max-width: 100%;
  height: 22px;
  padding: 0 8px;
  border-radius: 2px;
  border: 1px solid rgba(200, 170, 111, 0.22);
  background: rgba(200, 170, 111, 0.07);
  color: var(--rice-2);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tag--clan { border-color: rgba(139, 168, 201, 0.25); background: rgba(139, 168, 201, 0.09); color: #b9cde3; }
.seal {
  display: inline-grid; place-items: center;
  width: 24px; height: 24px;
  border: 1px solid rgba(194, 56, 56, 0.6);
  color: #d06a5a;
  font-family: var(--font-ancient);
  font-size: 12px;
  border-radius: 2px;
  transform: rotate(-4deg);
  opacity: 0.9;
}

/* ============ 指标卡 ============ */
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.metrics--six { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metric {
  position: relative;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(158deg, rgba(42, 34, 25, 0.8), rgba(19, 16, 12, 0.86));
  overflow: hidden;
  box-shadow: var(--shadow);
}
.metric::after {
  content: "";
  position: absolute;
  right: -28px; bottom: -38px;
  width: 100px; height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200, 170, 111, 0.09), transparent 68%);
  pointer-events: none;
}
.metric__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.metric__label { font-size: 11.5px; color: var(--muted); letter-spacing: 0.4px; }
.metric__icon {
  width: 26px; height: 26px; flex: none;
  display: grid; place-items: center;
  border-radius: 3px;
  background: rgba(200, 170, 111, 0.12);
  color: var(--gold);
}
.metric__value { font-family: var(--font-ancient); font-size: 25px; line-height: 1.2; margin-top: 8px; color: var(--gold-light); letter-spacing: 0.5px; }
.metric__value small { font-size: 12px; color: var(--muted); margin-left: 3px; font-family: var(--font-sans); }
.metric__foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; min-height: 20px; }
.metric__sub { font-size: 10.5px; color: var(--muted); }
.metric__spark { position: absolute; right: 12px; bottom: 10px; opacity: 0.8; }
.metric__badge { position: absolute; right: 12px; top: 44px; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
.delta b { font-weight: 600; font-variant-numeric: tabular-nums; }
.delta em { font-style: normal; color: var(--muted); font-size: 10px; }
.delta--up b, .delta--up .icon { color: var(--jade-2); }
.delta--down b, .delta--down .icon { color: var(--cinnabar-2); }
.delta--flat { color: var(--gold-dark); }

/* ============ 栅格 ============ */
.grid { display: grid; gap: 14px; }
.grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.col-span-2 { grid-column: span 2; }
.stack-gap { display: flex; flex-direction: column; gap: 14px; }

/* ============ 图表 ============ */
.chart { position: relative; width: 100%; min-width: 0; }
.chart-svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart-grid { stroke: rgba(200, 170, 111, 0.1); stroke-width: 1; }
.chart-axis { fill: #8f846f; font-size: 10px; font-family: var(--font-sans); }
.chart-value { fill: #b9a57f; font-size: 9.5px; font-family: var(--font-sans); }
.chart-dot { stroke: rgba(10, 10, 10, 0.7); stroke-width: 1; }
.chart-guide { opacity: 0; transition: opacity 0.12s; }
.chart-tip {
  position: absolute;
  z-index: 4;
  display: flex; flex-direction: column; gap: 1px;
  padding: 6px 9px;
  border: 1px solid rgba(200, 170, 111, 0.35);
  border-radius: 3px;
  background: rgba(16, 13, 10, 0.96);
  color: var(--rice);
  font-size: 11px;
  line-height: 1.5;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s;
  box-shadow: 0 8px 22px -12px #000;
  white-space: nowrap;
}
.chart-tip .tip-label { color: var(--muted); font-size: 10px; }
.chart-tip .tip-value { color: var(--gold-light); font-family: var(--font-ancient); font-size: 13px; }
.chart-tip .tip-name { color: var(--gold-dark); font-size: 10px; }
.chart-empty { height: 180px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 4px; }
.chart-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.hbars { display: flex; flex-direction: column; gap: 11px; }
.hbar__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.hbar__label { font-size: 12px; color: var(--rice-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar__value { font-family: var(--font-ancient); color: var(--gold-light); font-size: 14px; white-space: nowrap; }
.hbar__value small { font-family: var(--font-sans); font-size: 10px; color: var(--muted); margin-left: 2px; }
.hbar__track { height: 5px; border-radius: 3px; background: rgba(200, 170, 111, 0.09); overflow: hidden; }
.hbar__fill { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #8c7654, #d8bc83); }
.spark { display: block; }

/* ============ 表格 ============ */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(16, 13, 10, 0.5); }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  padding: 10px 14px;
  text-align: left;
  font-family: var(--font-ancient);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--muted);
  background: rgba(28, 23, 18, 0.9);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.data-table td { padding: 11px 14px; border-bottom: 1px solid rgba(200, 170, 111, 0.08); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr { transition: background 0.15s; }
.data-table tbody tr:hover { background: rgba(200, 170, 111, 0.045); }
.data-table .num { text-align: right; font-family: var(--font-ancient); color: var(--gold-light); font-size: 14px; }
.data-table .num--muted { color: var(--rice-2); font-family: var(--font-sans); font-size: 12px; }
.data-table .cell-main { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.data-table .cell-sub { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.table-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.pager { display: flex; align-items: center; gap: 6px; }
.pager__btn { min-width: 30px; height: 30px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 3px; background: transparent; color: var(--gold); }
.pager__btn:disabled { opacity: 0.35; }
.pager__info { font-size: 11.5px; color: var(--muted); }
.pager__info b { color: var(--gold-light); font-family: var(--font-ancient); }

/* ============ 筛选 / 分段 ============ */
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.filters .field { width: 140px; }
.filters .field--grow { flex: 1; min-width: 180px; width: auto; }
.seg { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 3px; background: rgba(12, 10, 8, 0.35); }
.seg__btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  min-height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}
.seg__btn:hover { color: var(--rice); background: rgba(200, 170, 111, 0.06); }
.seg__btn.is-active { background: rgba(200, 170, 111, 0.16); color: var(--gold-light); }
.seg--scroll { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
.seg--scroll::-webkit-scrollbar { display: none; }
.seg--plain { border: 0; padding: 0; gap: 4px; background: transparent; }
.seg--plain .seg__btn { border: 1px solid transparent; }
.seg--plain .seg__btn.is-active { border-color: var(--line-strong); background: rgba(200, 170, 111, 0.1); }

/* ============ 排行卡片 / 列表 ============ */
.rank-list { display: flex; flex-direction: column; gap: 8px; }
.rank-card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(28, 23, 18, 0.55);
  transition: background 0.15s, border-color 0.15s;
}
.rank-card:hover { background: rgba(200, 170, 111, 0.055); border-color: var(--line-strong); }
.rank-card__main { min-width: 0; flex: 1; }
.rank-card__name { font-size: 14px; color: var(--rice); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rank-card__meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; font-size: 11px; color: var(--muted); }
.rank-card__value { text-align: right; flex: none; }
.rank-card__value b { display: block; font-family: var(--font-ancient); font-size: 18px; color: var(--gold-light); font-weight: 500; }
.rank-card__value span { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; }
.medal {
  width: 28px; height: 28px; flex: none;
  display: inline-grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  color: var(--muted);
  font-family: var(--font-ancient);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.medal--sm { width: 22px; height: 22px; font-size: 11px; }
.medal.is-gold { background: linear-gradient(145deg, #f4dfae, #c9a45f 55%, #8a6528); color: #2a1c08; border-color: rgba(255, 235, 190, 0.6); box-shadow: 0 0 12px rgba(200, 170, 111, 0.35); }
.medal.is-silver { background: linear-gradient(145deg, #e4e4e4, #9fa3a8 60%, #6c7076); color: #24262a; border-color: rgba(240, 240, 240, 0.5); }
.medal.is-bronze { background: linear-gradient(145deg, #d7a06a, #a25f2c 65%, #6f3c18); color: #f7e2cd; border-color: rgba(220, 160, 110, 0.5); }

.mini-list { display: flex; flex-direction: column; gap: 2px; }
.mini-row { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 3px; }
.mini-row:hover { background: rgba(200, 170, 111, 0.05); }
.mini-row__rank { width: 20px; flex: none; text-align: center; font-family: var(--font-ancient); font-size: 13px; color: var(--muted); }
.mini-row__main { min-width: 0; flex: 1; }
.mini-row__name { font-size: 12.5px; color: var(--rice); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-row__sub { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-row__value { flex: none; font-family: var(--font-ancient); font-size: 13px; color: var(--cinnabar-2); font-variant-numeric: tabular-nums; }
.mini-row__value--muted { color: var(--muted); font-family: var(--font-sans); font-size: 11px; }
.list-scroll { max-height: 300px; overflow-y: auto; padding-right: 2px; }

/* ============ 门阀卡 ============ */
.clan-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.clan-card { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(158deg, rgba(40, 32, 24, 0.75), rgba(20, 16, 13, 0.8)); transition: border-color 0.16s, background 0.16s; }
.clan-card:hover { border-color: var(--line-strong); background: rgba(200, 170, 111, 0.05); }
.clan-card__head { display: flex; align-items: center; gap: 10px; }
.clan-card__title { min-width: 0; flex: 1; }
.clan-card__name { font-family: var(--font-ancient); font-size: 17px; color: var(--gold); letter-spacing: 0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clan-card__meta { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.clan-card__value { text-align: right; flex: none; }
.clan-card__value b { display: block; font-family: var(--font-ancient); font-size: 20px; color: var(--gold-light); font-weight: 500; }
.clan-card__value span { font-size: 10px; color: var(--muted); }
.clan-card__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 11px; }
.clan-card__stat { padding: 6px 4px; text-align: center; border: 1px solid rgba(200, 170, 111, 0.1); border-radius: 2px; background: rgba(9, 8, 6, 0.35); }
.clan-card__stat em { display: block; font-style: normal; font-size: 9.5px; color: var(--muted); }
.clan-card__stat b { display: block; margin-top: 1px; font-family: var(--font-ancient); font-size: 13px; color: var(--rice); font-weight: 500; }
.clan-card__bar { margin-top: 10px; }
.clan-card__bar-head { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-bottom: 4px; }
.clan-card__bar-head b { color: var(--cinnabar-2); font-family: var(--font-ancient); font-size: 12px; }
.progress { height: 4px; border-radius: 2px; background: rgba(200, 170, 111, 0.1); overflow: hidden; }
.progress span { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #8c3a2f, #c23838); }
.clan-card__foot { display: flex; justify-content: flex-end; margin-top: 9px; }

/* ============ 人员变动 ============ */
.change-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.change-box { padding: 9px 6px; text-align: center; border: 1px solid rgba(200, 170, 111, 0.12); border-radius: 3px; background: rgba(8, 7, 6, 0.3); }
.change-box__num { font-family: var(--font-ancient); font-size: 20px; line-height: 1.2; }
.change-box__num--up { color: var(--jade-2); }
.change-box__num--down { color: var(--cinnabar-2); }
.change-box__num--move { color: var(--blue); }
.change-box__label { font-size: 10px; color: var(--muted); margin-top: 2px; }
.change-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.change-chip { font-size: 10.5px; padding: 2px 7px; border-radius: 20px; border: 1px solid var(--line); color: var(--rice-2); }
.change-chip--up { border-color: rgba(95, 143, 109, 0.35); color: var(--jade-2); }
.change-chip--down { border-color: rgba(194, 56, 56, 0.35); color: #df9184; }

/* ============ 空状态 ============ */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 34px 16px; color: var(--muted); }
.empty__icon { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: rgba(200, 170, 111, 0.08); color: var(--gold-dark); margin-bottom: 10px; }
.empty__title { color: var(--rice); font-size: 13px; }
.empty__desc { font-size: 11.5px; margin-top: 4px; line-height: 1.6; max-width: 340px; }
.empty .btn { margin-top: 12px; }

/* ============ 导入 ============ */
.dropzone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  padding: 30px 18px;
  border: 1.5px dashed rgba(200, 170, 111, 0.32);
  border-radius: var(--radius);
  background: rgba(200, 170, 111, 0.025);
  cursor: pointer;
  transition: border-color 0.16s, background 0.16s;
}
.dropzone:hover, .dropzone.is-drag { border-color: var(--gold); background: rgba(200, 170, 111, 0.07); }
.dropzone__icon { color: var(--gold-dark); margin-bottom: 9px; }
.dropzone__title { font-family: var(--font-ancient); font-size: 16px; color: var(--gold-light); }
.dropzone__desc { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.dropzone__hint { font-size: 10.5px; color: var(--gold-dark); margin-top: 9px; letter-spacing: 1px; }
.preview__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.preview__stat { padding: 9px 6px; text-align: center; border: 1px solid var(--line); border-radius: 3px; background: rgba(8, 7, 6, 0.3); }
.preview__stat em { display: block; font-style: normal; font-size: 10px; color: var(--muted); }
.preview__stat b { display: block; margin-top: 2px; font-family: var(--font-ancient); font-size: 19px; color: var(--gold-light); font-weight: 500; }
.preview__row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; font-size: 12px; padding: 5px 0; border-bottom: 1px solid rgba(200, 170, 111, 0.07); }
.preview__row:last-child { border-bottom: 0; }
.preview__row span:first-child { color: var(--muted); min-width: 62px; flex: none; }
.preview__row span:last-child { color: var(--rice); min-width: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 10.5px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--line); color: var(--gold); background: rgba(200, 170, 111, 0.06); }
.import-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.import-side { display: flex; flex-direction: column; gap: 14px; }
.log-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
.log-item { padding: 9px 10px; border: 1px solid var(--line); border-radius: 3px; background: rgba(8, 7, 6, 0.25); }
.log-item__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.log-item__date { font-family: var(--font-ancient); color: var(--gold); font-size: 13px; }
.log-item__name { font-size: 11.5px; color: var(--rice-2); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-item__meta { display: flex; gap: 10px; margin-top: 4px; font-size: 10px; color: var(--muted); }
.help-list { display: flex; flex-direction: column; gap: 8px; font-size: 11.5px; color: var(--muted); line-height: 1.65; }
.help-list b { color: var(--rice); font-weight: 500; }
.help-list .dot { color: var(--gold); margin-right: 5px; }

/* ============ 铜矿 ============ */
.level-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.level-option { position: relative; }
.level-option input { position: absolute; opacity: 0; pointer-events: none; }
.level-option label {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 64px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: rgba(8, 7, 6, 0.3);
  cursor: pointer;
  transition: border-color 0.16s, background 0.16s;
}
.level-option label b { font-family: var(--font-ancient); font-size: 16px; color: var(--rice); font-weight: 500; }
.level-option label span { font-size: 10.5px; color: var(--muted); }
.level-option input:checked + label { border-color: var(--gold); background: rgba(200, 170, 111, 0.1); box-shadow: inset 0 0 0 1px rgba(200, 170, 111, 0.25); }
.level-option input:checked + label b { color: var(--gold-light); }
.balance { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.balance__item { padding: 9px 10px; border: 1px solid rgba(200, 170, 111, 0.12); border-radius: 3px; background: rgba(8, 7, 6, 0.3); }
.balance__item em { display: block; font-style: normal; font-size: 10px; color: var(--muted); }
.balance__item b { display: block; margin-top: 2px; font-family: var(--font-ancient); font-size: 16px; color: var(--gold-light); font-weight: 500; }
.balance__item--wide { grid-column: 1 / -1; }
.balance__item--wide b { font-size: 19px; }
.balance__item--neg b { color: var(--cinnabar-2); }
.rule-list { display: flex; flex-direction: column; gap: 7px; font-size: 12px; color: var(--muted); }
.rule-list .row { align-items: flex-start; gap: 7px; }
.rule-list .icon { color: var(--gold-dark); margin-top: 2px; }
.rule-list b { color: var(--gold-light); font-family: var(--font-ancient); font-size: 14px; font-weight: 500; }

/* ============ 管理中心 ============ */
.admin-tabs { margin-bottom: 16px; }
.weight-row { display: grid; grid-template-columns: 70px 1fr 74px; align-items: center; gap: 12px; }
.weight-row label { font-size: 12px; color: var(--rice-2); }
.weight-row .input { height: 34px; text-align: center; }
.weight-row input[type="range"] { width: 100%; accent-color: #c8aa6f; }
.weight-sum { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.weight-sum b { font-family: var(--font-ancient); font-size: 16px; color: var(--gold-light); }
.weight-sum.is-bad b { color: var(--cinnabar-2); }
.data-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid rgba(200, 170, 111, 0.08); font-size: 12px; }
.kv:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--muted); }
.kv span:last-child { color: var(--rice); }

/* ============ 弹窗 / 提示 ============ */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 90;
  display: flex; align-items: center; justify-content: center;
  padding: 18px;
  background: rgba(4, 3, 2, 0.72);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.16s;
}
.modal-backdrop.is-in { opacity: 1; }
.modal {
  width: 100%; max-width: 480px;
  max-height: 86vh;
  display: flex; flex-direction: column;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: linear-gradient(160deg, #241c15, #120f0c);
  box-shadow: 0 30px 80px -30px #000;
  transform: translateY(8px) scale(0.99);
  transition: transform 0.16s;
}
.modal-backdrop.is-in .modal { transform: none; }
.modal--wide { max-width: 620px; }
.modal__head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.modal__head h3 { font-family: var(--font-ancient); font-size: 17px; color: var(--gold); font-weight: 500; flex: 1; }
.modal__close { width: 30px; height: 30px; }
.modal__body { padding: 16px; overflow-y: auto; font-size: 13px; }
.modal__text { color: var(--rice-2); line-height: 1.7; }
.modal__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.modal .change-list { margin-top: 4px; }
.toast-root { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; width: max-content; max-width: min(92vw, 420px); }
.toast {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 10px 13px;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  background: rgba(24, 19, 15, 0.98);
  color: var(--rice);
  font-size: 12.5px;
  box-shadow: 0 14px 38px -18px #000;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 0.18s, transform 0.18s;
}
.toast.is-in { opacity: 1; transform: none; }
.toast__icon { color: var(--gold); margin-top: 1px; flex: none; }
.toast--success .toast__icon { color: var(--jade-2); }
.toast--error .toast__icon { color: var(--cinnabar-2); }

/* ============ 页脚 ============ */
.page-foot { margin-top: 26px; text-align: center; font-size: 10.5px; color: rgba(148, 136, 115, 0.55); letter-spacing: 1px; }
.page-foot .seal { vertical-align: -6px; margin-right: 6px; }

/* ============ 动效 ============ */
.view > * { animation: fadeUp 0.32s ease both; }
.view > *:nth-child(2) { animation-delay: 0.03s; }
.view > *:nth-child(3) { animation-delay: 0.06s; }
.view > *:nth-child(4) { animation-delay: 0.09s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ============ 响应式 ============ */
@media (max-width: 1180px) {
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .clan-grid { grid-template-columns: 1fr; }
  .import-layout { grid-template-columns: 1fr; }
}
@media (max-width: 960px) {
  .sidebar { display: none; }
  .main { margin-left: 0; }
  .view { padding: 14px 14px 88px; max-width: none; }
  .topbar {
    position: sticky; top: 0; z-index: 45;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    height: calc(54px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 14px 0;
    background: rgba(18, 15, 12, 0.94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .topbar .brand { padding: 0; gap: 8px; }
  .topbar .brand__mark { width: 30px; height: 30px; font-size: 18px; border-radius: 2px; }
  .topbar .brand__name { font-size: 16px; }
  .topbar .brand__sub { font-size: 9px; letter-spacing: 3px; }
  .topbar__actions { display: flex; align-items: center; gap: 7px; }
  .date-chip { font-size: 10.5px; color: var(--gold-light); border: 1px solid var(--line); border-radius: 2px; padding: 4px 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex;
    border-top: 1px solid var(--line);
    background: rgba(18, 15, 12, 0.96);
    backdrop-filter: blur(8px);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 7px 2px 6px;
    color: var(--muted);
    font-size: 9.5px;
    white-space: nowrap;
  }
  .tab.is-active { color: var(--gold); }
  .tab .icon { opacity: 0.9; }
  .tab.is-active .icon { filter: drop-shadow(0 0 6px rgba(200, 170, 111, 0.35)); }
  .page-head { margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .page-head__actions { flex: 0 0 100%; margin-left: 0; width: 100%; justify-content: flex-end; margin-top: 2px; }
  .page-head__actions .date-field { flex: 1; width: auto; min-width: 128px; max-width: none; }
  .page-head__icon { width: 36px; height: 36px; }
  .page-head__title { font-size: 21px; }
  .page-head__sub { font-size: 11.5px; }
  .page-head__actions { gap: 6px; }
  .page-head__actions .btn { min-height: 34px; padding: 0 10px; font-size: 12px; }

  <script>
/* 同盟战功统计看板 · 数据层（无依赖，可直接 file:// 打开） */
(function (global) {
  'use strict';

  const STORAGE_KEY = 'jtl.board.v1';
  const VERSION = 1;
  const DEFAULT_WEIGHTS = { contribution: 30, warMerit: 50, assist: 20 };
  const COPPER_COST = { 9: 50000, 10: 100000 };

  const ALIASES = {
    name: ['成员', '成员名', '成员名称', '玩家', '玩家名', '玩家名字', '昵称', '名字', '角色名', '角色', 'name', 'member'],
    clanName: ['门阀', '门阀名', '同盟', '同盟名', '联盟', '帮会', '公会', 'clan', 'alliance'],
    stateName: ['州', '州名', '出生州', '所在州', '地区', 'state'],
    powerValue: ['势力', '势力值', '战力', '战力值', 'power'],
    warMeritTotal: ['战功本周', '本周战功', '战功', '周战功', '战功总量', 'warmerit', 'war_merit'],
    contributionTotal: ['贡献本周', '本周贡献', '贡献', '同盟贡献', '周贡献', 'contribution'],
    assistTotal: ['助攻本周', '本周助攻', '助攻', '周助攻', 'assist'],
    donationTotal: ['捐献本周', '本周捐献', '捐献', '资源捐献', 'donation']
  };

  const NORMALIZE_HEADER = (s) => String(s || '')
    .replace(/^\uFEFF/, '')
    .replace(/\s+/g, '')
    .replace(/[（(][^）)]*[）)]/g, '')
    .replace(/[:：]/g, '')
    .toLowerCase();

  const ALIAS_LOOKUP = {};
  Object.keys(ALIASES).forEach((key) => {
    ALIASES[key].forEach((alias) => { ALIAS_LOOKUP[NORMALIZE_HEADER(alias)] = key; });
  });

  let store = null;
  try {
    if (global.localStorage) {
      const probe = '__jtl_probe__';
      global.localStorage.setItem(probe, '1');
      global.localStorage.removeItem(probe);
      store = global.localStorage;
    }
  } catch (err) { store = null; }

  let state = null;
  let cache = new Map();
  let lastSaveOk = true;

  /* ---------------- 日期与数字 ---------------- */
  const pad2 = (n) => String(n).padStart(2, '0');

  function dateKey(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function todayKey() { return dateKey(new Date()); }
  function parseKey(key) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key || ''));
    if (!m) return null;
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }
  function addDays(key, n) {
    const d = parseKey(key);
    if (!d) return key;
    d.setDate(d.getDate() + n);
    return dateKey(d);
  }
  function weekStart(key) {
    const d = parseKey(key);
    if (!d) return key;
    const offset = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - offset);
    return dateKey(d);
  }
  const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  function weekday(key) {
    const d = parseKey(key);
    return d ? WEEKDAYS[d.getDay()] : '';
  }
  function humanDate(key) {
    const d = parseKey(key);
    if (!d) return key || '--';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 · ' + WEEKDAYS[d.getDay()];
  }
  function shortDate(key) { return String(key || '').slice(5).replace('-', '.'); }
  function weekRangeLabel(key) {
    const s = weekStart(key);
    return shortDate(s) + ' - ' + shortDate(addDays(s, 6));
  }

  function fmt(n) {
    const v = Number(n);
    if (!isFinite(v)) return '0';
    const abs = Math.abs(v);
    const trim = (x) => x.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
    if (abs >= 1e8) return (v / 1e8).toFixed(2).replace(/\.00$/, '') + '亿';
    if (abs >= 1e4) return (v / 1e4).toFixed(2).replace(/\.00$/, '') + '万';
    return Math.round(v).toLocaleString('zh-CN');
  }
  function fmtFull(n) {
    const v = Number(n);
    return isFinite(v) ? Math.round(v).toLocaleString('zh-CN') : '0';
  }
  function fmtPct(v) {
    if (v === null || v === undefined || !isFinite(v)) return '';
    const sign = v > 0 ? '+' : '';
    return sign + (Math.round(v * 10) / 10).toFixed(1) + '%';
  }
  function parseNum(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    let s = String(v == null ? '' : v).trim().replace(/[,，\s]/g, '').replace(/^\+/, '');
    if (!s || /^[-—–－]+$/.test(s)) return 0;
    let mult = 1;
    if (/亿$/.test(s)) { mult = 1e8; s = s.slice(0, -1); }
    else if (/万$/.test(s)) { mult = 1e4; s = s.slice(0, -1); }
    else if (/[wW]$/.test(s)) { mult = 1e4; s = s.slice(0, -1); }
    else if (/[kK]$/.test(s)) { mult = 1e3; s = s.slice(0, -1); }
    const n = parseFloat(s);
    return isFinite(n) ? Math.round(n * mult) : 0;
  }

  /* ---------------- 状态 ---------------- */
  function blankState() {
    return {
      version: VERSION,
      demo: false,
      snapshots: {},
      importLogs: [],
      copperReports: [],
      weights: Object.assign({}, DEFAULT_WEIGHTS),
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
  }
  function validWeights(w) {
    if (!w) return null;
    const c = Math.max(0, Math.round(Number(w.contribution) || 0));
    const m = Math.max(0, Math.round(Number(w.warMerit) || 0));
    const a = Math.max(0, Math.round(Number(w.assist) || 0));
    if (c + m + a !== 100) return null;
    return { contribution: c, warMerit: m, assist: a };
  }
  function sanitizeMember(m) {
    return {
      name: String(m && m.name != null ? m.name : '').trim(),
      clanName: String((m && (m.clanName || m.clan)) || '未分门阀').replace(/^[\[【]|[\]】]$/g, '').trim() || '未分门阀',
      stateName: String((m && (m.stateName || m.state)) || '未知').trim() || '未知',
      powerValue: parseNum(m && (m.powerValue != null ? m.powerValue : m.power)),
      warMeritTotal: parseNum(m && m.warMeritTotal),
      contributionTotal: parseNum(m && m.contributionTotal),
      assistTotal: parseNum(m && m.assistTotal),
      donationTotal: parseNum(m && m.donationTotal)
    };
  }
  function adoptState(raw) {
    const s = blankState();
    s.demo = !!raw.demo;
    Object.keys(raw.snapshots || {}).forEach((date) => {
      const snap = raw.snapshots[date];
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !snap || !Array.isArray(snap.members)) return;
      s.snapshots[date] = {
        date: date,
        importedAt: snap.importedAt || new Date().toISOString(),
        fileName: snap.fileName || ('战报_' + date + '.csv'),
        members: snap.members.map(sanitizeMember).filter((m) => m.name)
      };
    });
    s.weights = validWeights(raw.weights) || Object.assign({}, DEFAULT_WEIGHTS);
    s.importLogs = Array.isArray(raw.importLogs) ? raw.importLogs.slice(0, 120) : [];
    s.copperReports = Array.isArray(raw.copperReports) ? raw.copperReports.filter((r) => r && r.player).map((r) => ({
      id: String(r.id || ('tk' + Math.random().toString(36).slice(2, 9))),
      player: String(r.player),
      coordinate: String(r.coordinate || ''),
      level: Number(r.level) === 10 ? 10 : 9,
      deducted: parseNum(r.deducted),
      status: ['pending', 'settled', 'void'].indexOf(r.status) >= 0 ? r.status : 'pending',
      note: String(r.note || ''),
      createdAt: r.createdAt || new Date().toISOString(),
      settledAt: r.settledAt || null
    })) : [];
    s.createdAt = raw.createdAt || s.createdAt;
    return s;
  }
  function persist() {
    if (!state) return false;
    state.updatedAt = new Date().toISOString();
    if (!store) { lastSaveOk = false; return false; }
    try {
      store.setItem(STORAGE_KEY, JSON.stringify(state));
      lastSaveOk = true;
      return true;
    } catch (err) {
      lastSaveOk = false;
      return false;
    }
  }
  function invalidate() {
    cache = new Map();
    persist();
  }
  function init() {
    if (state) return;
    let raw = null;
    try { raw = store ? store.getItem(STORAGE_KEY) : null; } catch (err) { raw = null; }
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.snapshots) { state = adoptState(parsed); return; }
      } catch (err) { /* 损坏时回退到演示数据 */ }
    }
    state = buildDemoState();
    persist();
  }

  /* ---------------- 演示数据 ---------------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const DEMO_NAMES = [
    '云中月', '北陌', '长安客', '一剑霜寒', '青衫落拓', '孤城闭', '折戟沉沙', '千山暮雪', '醉里挑灯', '落霞孤鹜',
    '风起长林', '江左梅郎', '铁马冰河', '夜阑听雨', '昆仑雪', '白衣卿相', '半盏清茶', '故人归', '大漠孤烟', '剑气如虹',
    '月照西楼', '山有扶苏', '沧海一粟', '清风徐来', '疏影横斜', '断桥残雪', '烟雨江南', '逐鹿中原', '横槊赋诗', '燕云十八骑',
    '龙城飞将', '不破楼兰', '玉门关', '天山雪', '塞北孤鸿', '南风知我意', '桃花扇', '青玉案', '临江仙', '水调歌头',
    '破阵子', '定风波', '满江红', '念奴娇', '如梦令', '雨霖铃', '鹧鸪天', '蝶恋花', '渔家傲', '苏幕遮',
    '江城子', '望江南', '采桑子', '菩萨蛮', '西江月', '点绛唇', '一剪梅', '醉花阴', '凤凰台上', '铜雀春深',
    '洛水惊鸿', '无痕', '墨白', '子夜', '惊蛰', '白露', '霜降', '小雪', '冬至', '谷雨',
    '长歌', '短歌', '行舟', '归途', '星河', '烛龙', '毕方', '麒麟', '朱雀', '玄武', '青龙', '白虎'
  ];
  const DEMO_CLANS = [
    { name: '九天揽月', state: '并州', size: 12 },
    { name: '龙渊', state: '冀州', size: 11 },
    { name: '山河故人', state: '青州', size: 10 },
    { name: '铁骑踏雪', state: '幽州', size: 10 },
    { name: '听雨阁', state: '扬州', size: 9 },
    { name: '焚天', state: '益州', size: 9 },
    { name: '白衣渡江', state: '荆州', size: 9 },
    { name: '星陨', state: '凉州', size: 8 }
  ];

  function buildDemoState() {
    const s = blankState();
    s.demo = true;
    const rnd = mulberry32(20261110);
    const specials = ['旧时友', '新雨', '青衫客'];
    const pool = specials.concat(DEMO_NAMES.filter((n) => specials.indexOf(n) < 0));
    let p = 0;
    const roster = [];
    DEMO_CLANS.forEach((c) => {
      for (let i = 0; i < c.size; i++) {
        const name = pool[p++] || ('无名客' + p);
        roster.push({
          name: name,
          clanName: c.name,
          stateName: c.state,
          powerValue: Math.round(900000 + rnd() * 8200000),
          activity: 0.25 + rnd() * 1.1
        });
      }
    });
    const find = (n) => roster.find((m) => m.name === n);
    const oldFriend = find('旧时友'); if (oldFriend) { oldFriend.clanName = '山河故人'; oldFriend.stateName = '青州'; }
    const newRain = find('新雨'); if (newRain) { newRain.clanName = '九天揽月'; newRain.stateName = '并州'; }
    const wanderer = find('青衫客'); if (wanderer) { wanderer.clanName = '听雨阁'; wanderer.stateName = '扬州'; }
    const stars = roster.filter((m) => specials.indexOf(m.name) < 0).slice(0, 4);
    stars.forEach((m, i) => { m.powerValue = 9600000 + i * 1350000; m.activity = 1.65 - i * 0.1; });
    roster.slice(-3).forEach((m) => { if (specials.indexOf(m.name) < 0) m.activity = 0.08; });

    const today = todayKey();
    const dates = [];
    for (let i = 13; i >= 0; i--) dates.push(addDays(today, -i));
    const leaveIdx = 13, joinIdx = 13, transferIdx = 13;
    const weekly = new Map();

    dates.forEach((date, di) => {
      const wk = weekStart(date);
      const snapMembers = [];
      roster.forEach((m) => {
        if (m.name === '旧时友' && di >= leaveIdx) return;
        if (m.name === '新雨' && di < joinIdx) return;
        let w = weekly.get(m.name);
        if (!w || w.week !== wk) {
          w = {
            week: wk,
            war: Math.round(rnd() * 90000),
            contribution: Math.round(rnd() * 16000),
            assist: Math.round(rnd() * 10000),
            donation: Math.round(rnd() * 6000)
          };
          weekly.set(m.name, w);
        }
        const zero = rnd() < 0.05 || m.activity < 0.2;
        const warGain = zero ? 0 : Math.round((30000 + rnd() * 170000) * m.activity);
        const contributionGain = zero ? 0 : Math.round((5000 + rnd() * 26000) * m.activity);
        const assistGain = zero ? 0 : Math.round((2000 + rnd() * 14000) * m.activity);
        const donationGain = zero ? 0 : Math.round((500 + rnd() * 5000) * m.activity);
        w.war += warGain; w.contribution += contributionGain; w.assist += assistGain; w.donation += donationGain;
        m.powerValue += Math.round(rnd() * 2600);
        const moved = m.name === '青衫客' && di >= transferIdx;
        snapMembers.push({
          name: m.name,
          clanName: moved ? '九天揽月' : m.clanName,
          stateName: moved ? '并州' : m.stateName,
          powerValue: m.powerValue,
          warMeritTotal: w.war,
          contributionTotal: w.contribution,
          assistTotal: w.assist,
          donationTotal: w.donation
        });
      });
      const importedAt = new Date(date + 'T08:30:00').toISOString();
      s.snapshots[date] = {
        date: date,
        importedAt: importedAt,
        fileName: '战报_' + date + '.csv',
        members: snapMembers
      };
      s.importLogs.push({
        id: 'demo-' + di,
        date: date,
        fileName: '战报_' + date + '.csv',
        memberCount: snapMembers.length,
        clanCount: new Set(snapMembers.map((x) => x.clanName)).size,
        mode: 'insert',
        importedAt: importedAt
      });
    });

    const latest = s.snapshots[today];
    if (latest && latest.members.length) {
      const top = latest.members.slice().sort((a, b) => b.warMeritTotal - a.warMeritTotal);
      const week = weekStart(today);
      const mk = (idx, level, status, dayOffset) => {
        const m = top[idx % top.length];
        return {
          id: 'demo-copper-' + idx,
          player: m.name,
          coordinate: '13' + (2 + idx) + ',' + (4 + idx * 3) + '06',
          level: level,
          deducted: COPPER_COST[level],
          status: status,
          note: '演示记录',
          createdAt: new Date(addDays(today, -dayOffset) + 'T09:30:00').toISOString(),
          settledAt: status === 'settled' ? new Date(addDays(today, -dayOffset) + 'T10:00:00').toISOString() : null
        };
      };
      s.copperReports = [mk(0, 9, 'pending', 0), mk(1, 10, 'settled', 0), mk(2, 9, 'void', 2)];
      s.importLogs.sort((a, b) => (a.importedAt < b.importedAt ? 1 : -1));
      s.importLogs = s.importLogs.slice(0, 120);
      void week;
    }
    return s;
  }

  /* ---------------- 日数据构建 ---------------- */
  function sortedDates() {
    return Object.keys(state.snapshots).sort();
  }
  function latestDate() {
    const d = sortedDates();
    return d.length ? d[d.length - 1] : null;
  }
  function getDay(date) {
    if (!state.snapshots[date]) return null;
    if (cache.has(date)) return cache.get(date);
    const built = buildDay(date);
    cache.set(date, built);
    return built;
  }
  function buildDay(date) {
    const dates = sortedDates();
    const idx = dates.indexOf(date);
    const snap = state.snapshots[date];
    const prevDate = idx > 0 ? dates[idx - 1] : null;
    const wk = weekStart(date);
    let sameWeekPrevDate = null;
    for (let i = idx - 1; i >= 0; i--) {
      if (weekStart(dates[i]) === wk) { sameWeekPrevDate = dates[i]; break; }
    }
    const baseSnap = sameWeekPrevDate ? state.snapshots[sameWeekPrevDate] : null;
    const baseMap = new Map();
    if (baseSnap) baseSnap.members.forEach((m) => baseMap.set(m.name, m));
    const status = !prevDate ? 'no_baseline' : (sameWeekPrevDate ? 'normal' : 'week_reset');

    const members = snap.members.map((raw) => {
      const b = baseMap.get(raw.name);
      const delta = (field) => b ? Math.max(0, (raw[field] || 0) - (b[field] || 0)) : (raw[field] || 0);
      const out = {
        name: raw.name,
        clanName: raw.clanName,
        stateName: raw.stateName,
        powerValue: raw.powerValue,
        warMeritTotal: raw.warMeritTotal,
        contributionTotal: raw.contributionTotal,
        assistTotal: raw.assistTotal,
        donationTotal: raw.donationTotal,
        warMeritDaily: delta('warMeritTotal'),
        contributionDaily: delta('contributionTotal'),
        assistDaily: delta('assistTotal'),
        donationDaily: delta('donationTotal'),
        isNew: status === 'normal' && !b
      };
      return out;
    });

    const w = normalizedWeights();
    const range = (field) => {
      let min = Infinity, max = -Infinity;
      members.forEach((m) => {
        const v = Number(m[field]) || 0;
        if (v < min) min = v;
        if (v > max) max = v;
      });
      return { min: isFinite(min) ? min : 0, max: isFinite(max) ? max : 0 };
    };
    const ranges = {
      warMeritDaily: range('warMeritDaily'),
      contributionDaily: range('contributionDaily'),
      assistDaily: range('assistDaily')
    };
    const norm = (v, r) => (r.max > r.min ? (v - r.min) / (r.max - r.min) : (r.max > 0 ? 1 : 0));
    members.forEach((m) => {
      const score = 100 * (
        w.warMerit * norm(m.warMeritDaily, ranges.warMeritDaily) +
        w.contribution * norm(m.contributionDaily, ranges.contributionDaily) +
        w.assist * norm(m.assistDaily, ranges.assistDaily)
      );
      m.activityScore = Math.round(score * 10) / 10;
    });

    const rankBy = (field, key) => {
      members.slice().sort((a, b) => (b[field] - a[field]) || a.name.localeCompare(b.name, 'zh')).forEach((m, i) => { m[key] = i + 1; });
    };
    rankBy('warMeritDaily', 'warMeritRank');
    rankBy('contributionDaily', 'contributionRank');
    rankBy('assistDaily', 'assistRank');
    rankBy('activityScore', 'activityRank');
    rankBy('warMeritTotal', 'totalRank');

    const clanGroups = new Map();
    members.forEach((m) => {
      if (!clanGroups.has(m.clanName)) clanGroups.set(m.clanName, []);
      clanGroups.get(m.clanName).push(m);
    });
    clanGroups.forEach((list) => {
      list.slice().sort((a, b) => (b.warMeritDaily - a.warMeritDaily) || a.name.localeCompare(b.name, 'zh'))
        .forEach((m, i) => { m.clanRank = i + 1; });
    });

    const clanMap = new Map();
    members.forEach((m) => {
      let c = clanMap.get(m.clanName);
      if (!c) {
        c = {
          clanName: m.clanName, stateName: m.stateName, memberCount: 0, activeCount: 0,
          warMeritDaily: 0, contributionDaily: 0, assistDaily: 0,
          warMeritTotal: 0, contributionTotal: 0, assistTotal: 0, donationTotal: 0,
          sumActivity: 0, stateCounts: {}
        };
        clanMap.set(m.clanName, c);
      }
      c.memberCount++;
      c.warMeritDaily += m.warMeritDaily;
      c.contributionDaily += m.contributionDaily;
      c.assistDaily += m.assistDaily;
      c.warMeritTotal += m.warMeritTotal;
      c.contributionTotal += m.contributionTotal;
      c.assistTotal += m.assistTotal;
      c.donationTotal += m.donationTotal;
      c.sumActivity += m.activityScore;
      c.stateCounts[m.stateName] = (c.stateCounts[m.stateName] || 0) + 1;
      if (m.warMeritDaily > 0 || m.contributionDaily > 0 || m.assistDaily > 0) c.activeCount++;
    });
    const clans = Array.from(clanMap.values()).map((c) => {
      const states = Object.keys(c.stateCounts).sort((a, b) => c.stateCounts[b] - c.stateCounts[a]);
      return {
        clanName: c.clanName,
        stateName: states[0] || '未知',
        stateCounts: c.stateCounts,
        memberCount: c.memberCount,
        activeCount: c.activeCount,
        warMeritDaily: c.warMeritDaily,
        contributionDaily: c.contributionDaily,
        assistDaily: c.assistDaily,
        warMeritTotal: c.warMeritTotal,
        contributionTotal: c.contributionTotal,
        assistTotal: c.assistTotal,
        donationTotal: c.donationTotal,
        avgActivityScore: Math.round((c.sumActivity / Math.max(1, c.memberCount)) * 10) / 10
      };
    });
    clans.sort((a, b) => b.warMeritDaily - a.warMeritDaily);
    clans.forEach((c, i) => { c.rank = i + 1; });

    const totals = {
      warMeritDaily: members.reduce((s2, m) => s2 + m.warMeritDaily, 0),
      contributionDaily: members.reduce((s2, m) => s2 + m.contributionDaily, 0),
      assistDaily: members.reduce((s2, m) => s2 + m.assistDaily, 0),
      donationDaily: members.reduce((s2, m) => s2 + m.donationDaily, 0),
      warMeritTotal: members.reduce((s2, m) => s2 + m.warMeritTotal, 0),
      contributionTotal: members.reduce((s2, m) => s2 + m.contributionTotal, 0),
      assistTotal: members.reduce((s2, m) => s2 + m.assistTotal, 0),
      donationTotal: members.reduce((s2, m) => s2 + m.donationTotal, 0)
    };
    const activeMembers = members.filter((m) => m.warMeritDaily > 0 || m.contributionDaily > 0 || m.assistDaily > 0).length;
    const byName = new Map();
    members.forEach((m) => byName.set(m.name, m));

    const changes = { warMerit: null, contribution: null, assist: null };
    let changeBasis = 'none';
    let basisDay = null;
    if (status === 'normal' && prevDate) {
      const prev = getDay(prevDate);
      if (prev && prev.status === 'normal') { basisDay = prev; changeBasis = 'prev'; }
    }
    if (!basisDay) {
      const altDate = addDays(date, -7);
      if (state.snapshots[altDate]) {
        const alt = getDay(altDate);
        if (alt && alt.status === 'normal') { basisDay = alt; changeBasis = 'weekAgo'; }
      }
    }
    if (basisDay) {
      const calc = (cur, old) => (old > 0 ? Math.round(((cur - old) / old) * 1000) / 10 : null);
      changes.warMerit = calc(totals.warMeritDaily, basisDay.totals.warMeritDaily);
      changes.contribution = calc(totals.contributionDaily, basisDay.totals.contributionDaily);
      changes.assist = calc(totals.assistDaily, basisDay.totals.assistDaily);
    }

    return {
      date: date,
      status: status,
      prevDate: prevDate,
      sameWeekPrevDate: sameWeekPrevDate,
      fileName: snap.fileName,
      importedAt: snap.importedAt,
      weekLabel: weekRangeLabel(date),
      members: members,
      byName: byName,
      clans: clans,
      totals: totals,
      activeMembers: activeMembers,
      totalMembers: members.length,
      totalClans: clans.length,
      changes: changes,
      changeBasis: changeBasis,
      ranges: ranges
    };
  }

  function normalizedWeights() {
    const w = state && state.weights ? state.weights : DEFAULT_WEIGHTS;
    const sum = w.contribution + w.warMerit + w.assist || 100;
    return { contribution: w.contribution / sum, warMerit: w.warMerit / sum, assist: w.assist / sum };
  }
  function weights() { return Object.assign({}, state.weights); }
  function setWeights(next) {
    const w = validWeights(next);
    if (!w) throw new Error('三项权重之和必须等于 100%');
    state.weights = w;
    invalidate();
    return w;
  }
  function resetWeights() {
    state.weights = Object.assign({}, DEFAULT_WEIGHTS);
    invalidate();
  }

  /* ---------------- 组合数据 ---------------- */
  function trend(date, days) {
    const n = days || 7;
    const dates = sortedDates().filter((d) => d <= date).slice(-n);
    return dates.map((d) => {
      const dd = getDay(d);
      return {
        date: d,
        label: d.slice(5),
        status: dd.status,
        warMeritDaily: dd.totals.warMeritDaily,
        contributionDaily: dd.totals.contributionDaily,
        assistDaily: dd.totals.assistDaily,
        activeMembers: dd.activeMembers,
        totalMembers: dd.totalMembers
      };
    });
  }
  function dashboard(date) {
    const d = getDay(date);
    if (!d) return null;
    const tr = trend(date, 7);
    const prev = d.prevDate ? getDay(d.prevDate) : null;
    const rising = [];
    let growthBasis = null, growthBasisLabel = '';
    if (d.status === 'normal' && prev && prev.status === 'normal') {
      growthBasis = prev; growthBasisLabel = '较昨日';
    } else {
      const altDate = addDays(date, -7);
      if (state.snapshots[altDate]) {
        const alt = getDay(altDate);
        if (alt && alt.status === 'normal') { growthBasis = alt; growthBasisLabel = '较上周同日'; }
      }
    }
    if (growthBasis) {
      d.members.forEach((m) => {
        const p = growthBasis.byName.get(m.name);
        if (!p) return;
        const growth = m.warMeritDaily - p.warMeritDaily;
        if (growth > 0) rising.push({ member: m, growth: growth, basis: growthBasisLabel });
      });
      rising.sort((a, b) => b.growth - a.growth);
    } else {
      d.members.slice().sort((a, b) => b.warMeritDaily - a.warMeritDaily).slice(0, 6).forEach((m) => {
        if (m.warMeritDaily > 0) rising.push({ member: m, growth: null, basis: '今日战功' });
      });
    }
    const inactive = [];
    const lookback = sortedDates().filter((x) => x <= date).slice(-14);
    d.members.forEach((m) => {
      let streak = 0;
      for (let i = lookback.length - 1; i >= 0; i--) {
        const dd = getDay(lookback[i]);
        const mm = dd.byName.get(m.name);
        if (!mm) break;
        if (mm.warMeritDaily === 0 && mm.contributionDaily === 0) streak++;
        else break;
      }
      if (streak > 0) inactive.push({ member: m, days: streak });
    });
    inactive.sort((a, b) => (b.days - a.days) || (a.member.activityScore - b.member.activityScore));
    return Object.assign({}, d, {
      trend: tr,
      rising: rising.slice(0, 6),
      inactive: inactive.slice(0, 8)
    });
  }
  function clanList(date) {
    const d = getDay(date);
    return d ? d.clans.slice() : [];
  }
  function clanDetail(name, date) {
    const d = getDay(date);
    if (!d) return null;
    const stat = d.clans.find((c) => c.clanName === name);
    const members = d.members.filter((m) => m.clanName === name)
      .sort((a, b) => (b.warMeritDaily - a.warMeritDaily) || a.name.localeCompare(b.name, 'zh'));
    if (!stat || !members.length) return null;
    const history = sortedDates().filter((x) => x <= date).slice(-7).map((x) => {
      const dd = getDay(x);
      const c = dd.clans.find((cc) => cc.clanName === name);
      return {
        date: x,
        status: dd.status,
        warMeritDaily: c ? c.warMeritDaily : 0,
        contributionDaily: c ? c.contributionDaily : 0,
        assistDaily: c ? c.assistDaily : 0,
        memberCount: c ? c.memberCount : 0,
        avgActivityScore: c ? c.avgActivityScore : 0
      };
    });
    return { clanName: name, day: d, stat: stat, members: members, history: history, stateName: stat.stateName };
  }
  function memberProfile(name) {
    const history = [];
    sortedDates().forEach((date) => {
      const dd = getDay(date);
      const m = dd.byName.get(name);
      if (m) history.push(Object.assign({}, m, { date: date, status: dd.status }));
    });
    if (!history.length) return null;
    const latest = history[history.length - 1];
    const latestDay = getDay(latest.date);
    return {
      name: name,
      clanName: latest.clanName,
      stateName: latest.stateName,
      powerValue: latest.powerValue,
      latest: latest,
      day: latestDay,
      history: history
    };
  }
  function changes(date) {
    const d = getDay(date);
    if (!d || !d.prevDate) return null;
    const prev = state.snapshots[d.prevDate];
    const prevMap = new Map(prev.members.map((m) => [m.name, m]));
    const added = [], lost = [], transfers = [], stateMoves = [];
    d.members.forEach((m) => {
      const p = prevMap.get(m.name);
      if (!p) added.push(m);
      else {
        if (p.clanName !== m.clanName) transfers.push({ name: m.name, from: p.clanName, to: m.clanName });
        if (p.stateName !== m.stateName) stateMoves.push({ name: m.name, from: p.stateName, to: m.stateName });
      }
    });
    prev.members.forEach((p) => { if (!d.byName.has(p.name)) lost.push(p); });
    return { date: date, prevDate: d.prevDate, added: added, lost: lost, transfers: transfers, stateMoves: stateMoves };
  }

  /* ---------------- CSV 解析 ---------------- */
  function parseDelimited(text) {
    const t = String(text || '').replace(/^\uFEFF/, '');
    const firstLine = t.split(/\r?\n/).find((l) => l.trim()) || '';
    let delim = ',';
    const tabs = (firstLine.match(/\t/g) || []).length;
    const commas = (firstLine.match(/,/g) || []).length;
    if (tabs > commas) delim = '\t';
    else if (commas === 0 && firstLine.indexOf(';') >= 0) delim = ';';
    const rows = [];
    let row = [], cell = '', quoted = false;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (quoted) {
        if (ch === '"') {
          if (t[i + 1] === '"') { cell += '"'; i++; }
          else quoted = false;
        } else cell += ch;
      } else if (ch === '"') quoted = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (ch !== '\r') cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.map((r) => r.map((c) => String(c).trim()));
  }
  function parseDateFromName(fileName) {
    const base = String(fileName || '').replace(/\.[^.]+$/, '');
    const candidates = [];
    let m = /(20\d{2})\s*[-_.年/]\s*(\d{1,2})\s*[-_.月/]\s*(\d{1,2})/.exec(base);
    if (m) candidates.push([+m[1], +m[2], +m[3]]);
    m = /(20\d{2})(\d{2})(\d{2})/.exec(base);
    if (m) candidates.push([+m[1], +m[2], +m[3]]);
    for (const c of candidates) {
      const d = new Date(c[0], c[1] - 1, c[2]);
      if (d.getFullYear() === c[0] && d.getMonth() === c[1] - 1 && d.getDate() === c[2]) {
        return { date: dateKey(d), source: 'filename' };
      }
    }
    m = /(?:^|\D)(\d{1,2})\s*[-_.月/]\s*(\d{1,2})(?:日|\D|$)/.exec(base);
    if (m) {
      const now = new Date();
      let year = now.getFullYear();
      let d = new Date(year, +m[1] - 1, +m[2]);
      if (d.getTime() - now.getTime() > 60 * 24 * 3600 * 1000) {
        d = new Date(year - 1, +m[1] - 1, +m[2]);
      }
      if (d.getMonth() === +m[1] - 1 && d.getDate() === +m[2]) {
        return { date: dateKey(d), source: 'filename' };
      }
    }
    return { date: null, source: null };
  }
  function parseCSV(text, fileName) {
    const rows = parseDelimited(text);
    if (!rows.length) throw new Error('文件内容为空');
    let headerIndex = -1, bestScore = 0, map = null;
    const limit = Math.min(20, rows.length);
    for (let i = 0; i < limit; i++) {
      const candidate = {};
      let score = 0;
      rows[i].forEach((cell, ci) => {
        const key = ALIAS_LOOKUP[NORMALIZE_HEADER(cell)];
        if (key && candidate[key] === undefined) { candidate[key] = ci; score++; }
      });
      if (candidate.name !== undefined &&
        (candidate.warMeritTotal !== undefined || candidate.contributionTotal !== undefined || candidate.assistTotal !== undefined) &&
        score > bestScore) {
        headerIndex = i; bestScore = score; map = candidate;
      }
    }
    if (headerIndex < 0 || !map) {
      throw new Error('未识别到表头。请确认 CSV 至少包含「成员」以及「战功本周 / 贡献本周 / 助攻本周」中的一列。');
    }
    const warnings = [];
    const missing = [];
    if (map.clanName === undefined) missing.push('门阀');
    if (map.stateName === undefined) missing.push('州');
    if (map.powerValue === undefined) missing.push('势力值');
    ['warMeritTotal', 'contributionTotal', 'assistTotal'].forEach((k) => {
      if (map[k] === undefined) missing.push({ warMeritTotal: '战功本周', contributionTotal: '贡献本周', assistTotal: '助攻本周' }[k]);
    });
    if (missing.length) warnings.push('以下列未找到，将按 0 处理：' + missing.join('、'));
    const cell = (row, key) => (map[key] === undefined ? '' : row[map[key]]);
    const rowsOut = [];
    const seen = new Map();
    let duplicates = 0;
    for (let i = headerIndex + 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || r.every((c) => c === '')) continue;
      const rawName = cell(r, 'name');
      if (!rawName || /^(合计|总计|汇总|全员|成员|玩家|角色名)$/.test(rawName)) continue;
      const member = sanitizeMember({
        name: rawName,
        clanName: cell(r, 'clanName') || '未分门阀',
        stateName: cell(r, 'stateName') || '未知',
        powerValue: cell(r, 'powerValue'),
        warMeritTotal: cell(r, 'warMeritTotal'),
        contributionTotal: cell(r, 'contributionTotal'),
        assistTotal: cell(r, 'assistTotal'),
        donationTotal: cell(r, 'donationTotal')
      });
      if (seen.has(member.name)) {
        duplicates++;
        rowsOut[seen.get(member.name)] = member;
      } else {
        seen.set(member.name, rowsOut.length);
        rowsOut.push(member);
      }
    }
    if (!rowsOut.length) throw new Error('没有解析到有效的成员数据，请检查 CSV 内容。');
    if (duplicates) warnings.push('有 ' + duplicates + ' 个重名成员，已保留最后一条记录。');
    const clans = Array.from(new Set(rowsOut.map((m) => m.clanName)));
    const states = Array.from(new Set(rowsOut.map((m) => m.stateName)));
    const dateInfo = parseDateFromName(fileName);
    return {
      rows: rowsOut,
      fileName: fileName || '',
      date: dateInfo.date,
      dateSource: dateInfo.source,
      memberCount: rowsOut.length,
      clanCount: clans.length,
      stateCount: states.length,
      clans: clans,
      states: states,
      sampleMembers: rowsOut.slice(0, 6).map((m) => m.name),
      warnings: warnings,
      duplicateCount: duplicates
    };
  }
  function commitImport(opts) {
    const date = opts.date;
    const rows = opts.rows || [];
    const mode = opts.mode || 'insert';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error('请选择有效的战报日期');
    if (!rows.length) throw new Error('没有可导入的数据');
    if (state.snapshots[date] && mode === 'skip') return { skipped: true };
    if (state.demo) {
      state.snapshots = {};
      state.importLogs = [];
      state.copperReports = [];
      state.demo = false;
    }
    const now = new Date().toISOString();
    state.snapshots[date] = {
      date: date,
      importedAt: now,
      fileName: opts.fileName || ('战报_' + date + '.csv'),
      members: rows.map(sanitizeMember).filter((m) => m.name)
    };
    const clans = new Set(rows.map((m) => m.clanName));
    state.importLogs.unshift({
      id: 'log-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      date: date,
      fileName: opts.fileName || ('战报_' + date + '.csv'),
      memberCount: rows.length,
      clanCount: clans.size,
      mode: mode,
      importedAt: now
    });
    state.importLogs = state.importLogs.slice(0, 120);

    const name = String(player || '').trim();

    if (!d || !name) return none;
    const member = d.byName.get(name);
    if (!member) return none;
    const wk = weekStart(d.date);
    const reports = state.copperReports.filter((r) => r.player === name && r.status !== 'void' && weekStart(reportDate(r)) === wk);
    const settled = reports.filter((r) => r.status === 'settled').reduce((s, r) => s + r.deducted, 0);
    const pending = reports.filter((r) => r.status === 'pending').reduce((s, r) => s + r.deducted, 0);
    return {
      found: true,
      total: member.warMeritTotal,
      settled: settled,
      pending: pending,

    if (!coordinate) throw new Error('请填写铜矿坐标');

    const bal = copperBalance(player);
    if (!bal.found) throw new Error('未找到该玩家，请确认名字与最新战报一致');
    if (bal.available < cost) throw new Error('可用战功不足：可用 ' + fmtFull(bal.available) + '，需要 ' + fmtFull(cost));
    const rec = {
      id: 'tk' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      player: player,
      coordinate: coordinate,
      level: level,
      deducted: cost,
      status: 'pending',

      createdAt: new Date().toISOString(),

  }
  function settleCopper(id) {
    const r = state.copperReports.find((x) => x.id === id);
    if (!r || r.status !== 'pending') return false;
    r.status = 'settled';
    r.settledAt = new Date().toISOString();
    persist();
    return true;
  }
  function voidCopper(id) {
    const r = state.copperReports.find((x) => x.id === id);
    if (!r || r.status !== 'pending') return false;
    r.status = 'void';
    r.settledAt = new Date().toISOString();
    persist();
    return true;
  }
  function copperList() {
    return state.copperReports.slice().sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
  }
  function copperStats() {
    const today = todayKey();
    const list = state.copperReports;
    const settled = list.filter((r) => r.status === 'settled');
    return {
      todayCount: list.filter((r) => reportDate(r) === today).length,
      pendingCount: list.filter((r) => r.status === 'pending').length,
      settledCount: settled.length,
      settledTotal: settled.reduce((s, r) => s + r.deducted, 0),
      total: list.length

  }

  /* ---------------- 备份 ---------------- */
  function exportJSON() {
    return JSON.stringify(Object.assign({}, state, { exportedAt: new Date().toISOString() }), null, 2);
  }

    try { raw = JSON.parse(text); } catch (err) { throw new Error('JSON 解析失败，请确认文件完整'); }
    if (!raw || typeof raw !== 'object' || !raw.snapshots) throw new Error('文件不是本看板的备份格式');
    const next = adoptState(raw);
    if (!Object.keys(next.snapshots).length) throw new Error('备份中没有任何战报数据');
    state = next;
    invalidate();

  }

  /* ---------------- 文案 ---------------- */
  function statusInfo(status) {
    if (status === 'no_baseline') {
      return {
        key: 'no_baseline', label: '本周至今 · 无基线', tone: 'gold',
        desc: '首次导入数据，暂无昨日基线，当前值为本周累计值。导入明日数据后将自动计算真实的当日增量。'
      };
    }
    if (status === 'week_reset') {
      return {

        desc: '检测到本周数据重置（新一周开始），当日值按新一周累计展示。'
      };
    }
    return {
      key: 'normal', label: '当日增量', tone: 'jade',
      desc: '有昨日基线，当日值 = 今日本周累计 − 昨日本周累计。'

  }
  function dailyLabel(status, base) {
    if (status === 'no_baseline') return base.replace('今日', '本周');
    if (status === 'week_reset') return base.replace('今日', '新周');
    return base;
  }
  function totalLabel(status, base) {
    return base;
  }

  const API = {
    init: init,
    isDemo: isDemo,
    storageAvailable: storageAvailable,
    storageBytes: storageBytes,
    saveOk: saveOk,
    dates: sortedDates,
    latestDate: latestDate,
    day: getDay,
    dashboard: dashboard,
    trend: trend,
    clanList: clanList,
    clanDetail: clanDetail,
    memberProfile: memberProfile,
    changes: changes,
    weights: weights,
    setWeights: setWeights,
    resetWeights: resetWeights,
    defaultWeights: DEFAULT_WEIGHTS,
    parseCSV: parseCSV,
    parseDateFromName: parseDateFromName,
    commitImport: commitImport,
    deleteSnapshot: deleteSnapshot,
    importLogs: importLogs,
    copperCost: COPPER_COST,
    copperBalance: copperBalance,
    addCopper: addCopper,
    settleCopper: settleCopper,
    voidCopper: voidCopper,
    copperList: copperList,
    copperStats: copperStats,
    exportJSON: exportJSON,
    importJSON: importJSON,
    loadDemo: loadDemo,
    clearAll: clearAll,
    statusInfo: statusInfo,
    dailyLabel: dailyLabel,
    totalLabel: totalLabel,
    dateKey: dateKey,
    todayKey: todayKey,
    addDays: addDays,
    weekStart: weekStart,
    weekRangeLabel: weekRangeLabel,
    humanDate: humanDate,
    weekday: weekday,
    shortDate: shortDate,
    fmt: fmt,
    fmtFull: fmtFull,
    fmtPct: fmtPct,
    parseNum: parseNum

  global.BoardData = API;
