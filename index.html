  <script>
/* 轻量 SVG 图表（无第三方依赖） */
(function (global) {
  'use strict';

  const COLORS = {
    gold: '#c9a96e',
    goldLight: '#e9d4a5',
    cinnabar: '#c0503f',
    jade: '#6f9c7d',
    blue: '#7fa6c9',
    muted: '#9a8f7a'
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmt(v) {
    return global.BoardData ? global.BoardData.fmt(v) : String(v);
  }
  function axisFmt(v) {
    const n = Number(v) || 0;
    if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(n % 1e8 === 0 ? 0 : 1) + '亿';
    if (Math.abs(n) >= 1e4) return (n / 1e4).toFixed(n % 1e4 === 0 ? 0 : 1) + '万';
    return String(Math.round(n));
  }
  function niceMax(v) {
    if (!isFinite(v) || v <= 0) return 1;
    const exp = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / exp;
    const nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return nf * exp;
  }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  function svgEl(width, height, inner, label) {
    return '<svg class="chart-svg" viewBox="0 0 ' + width + ' ' + height + '" width="' + width + '" height="' + height +
      '" role="img" aria-label="' + esc(label || '图表') + '">' + inner + '</svg>';
  }

  function tooltipHTML(name, label, value) {
    return '<span class="tip-label">' + esc(label) + '</span><span class="tip-value">' + esc(fmt(value)) + '</span>' +
      (name ? '<span class="tip-name">' + esc(name) + '</span>' : '');
  }

  function line(el, cfg) {
    if (!el) return;
    const labels = (cfg.labels || []).slice();
    const values = (cfg.values || []).map((v) => Number(v) || 0);
    if (!labels.length) {
      el.innerHTML = '<div class="chart-empty">暂无趋势数据</div>';
      return;
    }
    if (labels.length < 2) {
      el.innerHTML = '<div class="chart-empty">需要至少 2 天战报才能画出走势</div>';
      return;
    }
    const width = Math.max(260, el.clientWidth || 600);
    const height = cfg.height || 250;
    const pad = { l: 48, r: 16, t: 16, b: 30 };
    const iw = width - pad.l - pad.r;
    const ih = height - pad.t - pad.b;
    const max = niceMax(Math.max.apply(null, values.concat([1])));
    const n = values.length;
    const xAt = (i) => pad.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
    const yAt = (v) => pad.t + ih - (v / max) * ih;
    const color = cfg.color || COLORS.gold;
    const gid = 'lg' + Math.random().toString(36).slice(2, 8);
    const pts = values.map((v, i) => [xAt(i), yAt(v)]);
    const linePath = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const areaPath = linePath + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (pad.t + ih) +
      ' L' + pts[0][0].toFixed(1) + ' ' + (pad.t + ih) + ' Z';
    let grid = '';
    const ticks = 4;
    for (let i = 0; i <= ticks; i++) {
      const y = pad.t + (ih / ticks) * i;
      const val = max - (max / ticks) * i;
      grid += '<line class="chart-grid" x1="' + pad.l + '" y1="' + y.toFixed(1) + '" x2="' + (width - pad.r) + '" y2="' + y.toFixed(1) + '"/>';
      grid += '<text class="chart-axis" x="' + (pad.l - 8) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + axisFmt(val) + '</text>';
    }
    let xs = '';
    const maxLabels = width < 420 ? 4 : 7;
    const step = Math.max(1, Math.ceil((n - 1) / Math.max(1, maxLabels - 1)));
    labels.forEach((lab, i) => {
      if (i !== 0 && i % step !== 0) {
        if (i !== n - 1) return;
        const lastLabeled = Math.floor((n - 1) / step) * step;
        if (i - lastLabeled < Math.ceil(step / 2)) return;
      }
      xs += '<text class="chart-axis" x="' + xAt(i).toFixed(1) + '" y="' + (height - 10) + '" text-anchor="middle">' + esc(lab) + '</text>';
    });
    let dots = '';
    pts.forEach((p, i) => {
      dots += '<circle class="chart-dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="' + color + '"><title>' + esc(labels[i] + ' ' + fmt(values[i])) + '</title></circle>';
    });
    const inner =
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + color + '" stop-opacity="0.32"/>' +
      '<stop offset="1" stop-color="' + color + '" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      grid +
      '<path d="' + areaPath + '" fill="url(#' + gid + ')"/>' +
      '<path d="' + linePath + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<line class="chart-guide" x1="0" y1="' + pad.t + '" x2="0" y2="' + (pad.t + ih) + '" stroke="' + color + '" stroke-opacity="0.35" stroke-dasharray="3 3"/>' +
      dots + xs;
    el.classList.add('chart');
    el.innerHTML = svgEl(width, height, inner, cfg.label || '趋势图') + '<div class="chart-tip" aria-hidden="true"></div>';
    const tip = el.querySelector('.chart-tip');
    const svg = el.querySelector('svg');
    const guide = el.querySelector('.chart-guide');
    const move = (clientX) => {
      const rect = svg.getBoundingClientRect();
      const x = ((clientX - rect.left) / Math.max(1, rect.width)) * width;
      const i = clamp(Math.round(((x - pad.l) / iw) * (n - 1)), 0, n - 1);
      tip.innerHTML = tooltipHTML(cfg.name, labels[i], values[i]);
      tip.style.opacity = '1';
      const px = (pts[i][0] / width) * rect.width;
      const py = (pts[i][1] / height) * rect.height;
      const tw = tip.offsetWidth || 110;
      tip.style.left = clamp(px - tw / 2, 4, rect.width - tw - 4) + 'px';
      tip.style.top = Math.max(4, py - 46) + 'px';
      guide.setAttribute('x1', pts[i][0]);
      guide.setAttribute('x2', pts[i][0]);
      guide.style.opacity = '1';
    };
    svg.addEventListener('pointermove', (e) => move(e.clientX));
    svg.addEventListener('pointerdown', (e) => move(e.clientX));
    svg.addEventListener('pointerleave', () => {
      tip.style.opacity = '0';
      guide.style.opacity = '0';
    });
  }

  function bar(el, cfg) {
    if (!el) return;
    const items = (cfg.items || []).slice();
    if (!items.length) {
      el.innerHTML = '<div class="chart-empty">暂无数据</div>';
      return;
    }
    const width = Math.max(260, el.clientWidth || 600);
    const height = cfg.height || 260;
    const pad = { l: 48, r: 12, t: 18, b: 48 };
    const iw = width - pad.l - pad.r;
    const ih = height - pad.t - pad.b;
    const max = niceMax(Math.max.apply(null, items.map((it) => it.value).concat([1])));
    const band = iw / items.length;
    const bw = Math.max(6, Math.min(46, band * 0.55));
    const color = cfg.color || COLORS.gold;
    let grid = '';
    for (let i = 0; i <= 4; i++) {
      const y = pad.t + (ih / 4) * i;
      grid += '<line class="chart-grid" x1="' + pad.l + '" y1="' + y.toFixed(1) + '" x2="' + (width - pad.r) + '" y2="' + y.toFixed(1) + '"/>';
      grid += '<text class="chart-axis" x="' + (pad.l - 8) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + axisFmt(max - (max / 4) * i) + '</text>';
    }
    let bars = '', labels = '', hits = '';
    const rotate = items.length > 5 || items.some((it) => String(it.label).length > 4);
    items.forEach((it, i) => {
      const h = Math.max(1, (it.value / max) * ih);
      const x = pad.l + band * i + (band - bw) / 2;
      const y = pad.t + ih - h;
      bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) +
        '" rx="2" fill="' + color + '" fill-opacity="' + (0.55 + 0.35 * (1 - i / items.length)).toFixed(2) + '"><title>' +
        esc(it.label + ' ' + fmt(it.value)) + '</title></rect>';
      if (items.length <= 8 && bw >= 24) {
        bars += '<text class="chart-value" x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle">' + esc(fmt(it.value)) + '</text>';
      }
      const cx = pad.l + band * i + band / 2;
      if (rotate) {
        labels += '<text class="chart-axis" x="' + cx.toFixed(1) + '" y="' + (height - 14) + '" text-anchor="end" transform="rotate(-32 ' + cx.toFixed(1) + ' ' + (height - 14) + ')">' + esc(it.label) + '</text>';
      } else {
        labels += '<text class="chart-axis" x="' + cx.toFixed(1) + '" y="' + (height - 16) + '" text-anchor="middle">' + esc(it.label) + '</text>';
      }
      hits += '<rect class="chart-hit" data-i="' + i + '" x="' + (pad.l + band * i).toFixed(1) + '" y="' + pad.t + '" width="' + band.toFixed(1) + '" height="' + ih + '" fill="transparent"/>';
    });
    el.classList.add('chart');
    el.innerHTML = svgEl(width, height, grid + bars + labels + hits, cfg.label || '柱状图') + '<div class="chart-tip" aria-hidden="true"></div>';
    const tip = el.querySelector('.chart-tip');
    const svg = el.querySelector('svg');
    svg.querySelectorAll('.chart-hit').forEach((rect) => {
      rect.addEventListener('pointermove', (e) => {
        const i = Number(rect.getAttribute('data-i'));
        const it = items[i];
        tip.innerHTML = tooltipHTML(cfg.name, it.label, it.value);
        tip.style.opacity = '1';
        const bounds = svg.getBoundingClientRect();
        const px = ((pad.l + band * i + band / 2) / width) * bounds.width;
        const tw = tip.offsetWidth || 110;
        tip.style.left = clamp(px - tw / 2, 4, bounds.width - tw - 4) + 'px';
        tip.style.top = '6px';
      });
      rect.addEventListener('pointerleave', () => { tip.style.opacity = '0'; });
    });
  }

  function mount(el, renderer, cfg) {
    if (!el) return;
    const draw = () => {
      if (!el.isConnected) return;
      const w = el.clientWidth || (el.parentElement && el.parentElement.clientWidth) || 600;
      if (!w) return;
      if (el._chartW === w) return;
      el._chartW = w;
      renderer(el, Object.assign({}, cfg, { width: w }));
    };
    draw();
    if (typeof ResizeObserver !== 'undefined') {
      if (el._chartRO) el._chartRO.disconnect();
      let timer = null;
      const ro = new ResizeObserver(() => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          if (!el.isConnected) { ro.disconnect(); return; }
          el._chartW = -1;
          draw();
        }, 120);
      });
      ro.observe(el);
      el._chartRO = ro;
    }
  }

  function spark(values, color) {
    const vals = (values || []).map((v) => Number(v) || 0);
    if (vals.length < 2) return '';
    const w = 92, h = 26, pad = 2;
    const max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    const span = max - min || 1;
    const pts = vals.map((v, i) => [pad + (i / (vals.length - 1)) * (w - pad * 2), h - pad - ((v - min) / span) * (h - pad * 2)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = d + ' L' + (w - pad) + ' ' + h + ' L' + pad + ' ' + h + ' Z';
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">' +
      '<path d="' + area + '" fill="' + color + '" fill-opacity="0.12"/>' +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function hbars(items, opts) {
    const list = (items || []).slice();
    if (!list.length) return '<div class="chart-empty">暂无数据</div>';
    const max = opts && opts.max ? opts.max : Math.max.apply(null, list.map((it) => it.value).concat([1]));
    return '<div class="hbars">' + list.map((it, i) => {
      const pct = clamp((it.value / max) * 100, 0, 100);
      return '<div class="hbar">' +
        '<div class="hbar__head"><span class="hbar__label" title="' + esc(it.label) + '">' + esc(it.label) + '</span>' +
        '<span class="hbar__value">' + esc(it.display || fmt(it.value)) + (it.unit ? '<small>' + esc(it.unit) + '</small>' : '') + '</span></div>' +
        '<div class="hbar__track"><span class="hbar__fill" style="width:' + pct.toFixed(1) + '%;background:' + (it.color || (i === 0 ? COLORS.gold : COLORS.gold)) + ';opacity:' + (0.95 - i * 0.06).toFixed(2) + '"></span></div>' +
        '</div>';
    }).join('') + '</div>';
  }

  global.BoardCharts = { line: line, bar: bar, mount: mount, spark: spark, hbars: hbars, COLORS: COLORS };
})(typeof window !== 'undefined' ? window : globalThis);

(function (global) {

    trophy: '<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h2a2 2 0 0 1 0 4h-2"/><path d="M7 5H5a2 2 0 0 0 0 4h2"/>',

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function icon(name, size, cls) {
    const paths = ICONS[name] || ICONS.info;
    return '<svg class="icon ' + (cls || '') + '" width="' + (size || 18) + '" height="' + (size || 18) +
      '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';

  function toast(message, type) {
    const root = document.getElementById('toast-root');
    if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast toast--' + (type || 'info');
    el.setAttribute('role', 'status');
    el.innerHTML = '<span class="toast__icon">' + icon(type === 'error' ? 'alert' : type === 'success' ? 'check' : 'info', 16) + '</span><span>' + esc(message) + '</span>';
    root.appendChild(el);
    requestAnimationFrame(() => el.classList.add('is-in'));
    setTimeout(() => {
      el.classList.remove('is-in');
      setTimeout(() => el.remove(), 220);
    }, 3400);
  }
  function modal(opts) {
    const root = document.getElementById('modal-root');
    if (!root) return { close: function () {} };
    const prev = root.querySelector('.modal-backdrop');
    if (prev) prev.remove();
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.innerHTML = '<div class="modal ' + (opts.wide ? 'modal--wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title || '提示') + '">' +
      '<div class="modal__head"><h3>' + esc(opts.title || '提示') + '</h3>' +
      '<button class="icon-btn modal__close" type="button" aria-label="关闭">' + icon('x', 18) + '</button></div>' +
      '<div class="modal__body">' + (opts.body || '') + '</div>' +
      (opts.actions && opts.actions.length ? '<div class="modal__foot">' + opts.actions.map((a, i) =>
        '<button type="button" class="btn ' + (a.variant || 'btn--ghost') + '" data-modal-action="' + i + '">' + esc(a.label) + '</button>').join('') + '</div>' : '') +
      '</div>';
    root.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('is-in'));

      wrap.classList.remove('is-in');
      setTimeout(() => wrap.remove(), 160);
      document.removeEventListener('keydown', onKey);
      if (opts.onClose) opts.onClose();
    };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
    wrap.querySelector('.modal__close').addEventListener('click', close);
    (opts.actions || []).forEach((a, i) => {
      const btn = wrap.querySelector('[data-modal-action="' + i + '"]');
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (a.onClick) {
          const keep = a.onClick();
          if (keep === false) return;
        }
        close();
      });
    });
    return { close: close, el: wrap };
  }
  function confirmDialog(opts) {
    return new Promise((resolve) => {
      let answered = false;
      modal({
        title: opts.title || '请确认',
        body: '<p class="modal__text">' + esc(opts.message || '') + '</p>',
        actions: [
          { label: opts.cancelText || '取消', variant: 'btn--ghost' },
          {
            label: opts.confirmText || '确定', variant: opts.danger ? 'btn--danger' : 'btn--gold',
            onClick: function () { answered = true; resolve(true); }
          }
        ],
        onClose: function () { if (!answered) resolve(false); }
      });
    });
  }
  function download(filename, content, type) {
    const blob = new Blob([content], { type: type || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }
  function debounce(fn, wait) {
    let t = null;
    return function () {
      const args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(() => fn.apply(ctx, args), wait);
    };
  }
  function delta(pct, basis) {
    if (pct === null || pct === undefined || !isFinite(pct)) {
      return '<span class="delta delta--flat"><span>—</span><em>' + esc(basis || '暂无对比') + '</em></span>';
    }
    const up = pct >= 0;
    return '<span class="delta ' + (up ? 'delta--up' : 'delta--down') + '">' + icon(up ? 'arrowUp' : 'arrowDown', 12) +
      '<b>' + esc(global.BoardData ? global.BoardData.fmtPct(pct) : pct + '%') + '</b><em>' + esc(basis || '较昨日') + '</em></span>';
  }
  function statusBadge(status, small) {
    const info = global.BoardData ? global.BoardData.statusInfo(status) : { label: status, tone: 'jade' };
    return '<span class="badge badge--' + info.tone + (small ? ' badge--sm' : '') + '">' + esc(info.label) + '</span>';
  }
  function medallion(rank, small) {
    const r = Number(rank) || 0;
    const cls = r === 1 ? ' is-gold' : r === 2 ? ' is-silver' : r === 3 ? ' is-bronze' : '';
    return '<span class="medal' + cls + (small ? ' medal--sm' : '') + '" aria-label="第 ' + r + ' 名">' + r + '</span>';
  }
  function empty(iconName, title, desc, extra) {
    return '<div class="empty">' + '<div class="empty__icon">' + icon(iconName || 'info', 26) + '</div>' +
      '<div class="empty__title">' + esc(title || '暂无数据') + '</div>' +
      (desc ? '<div class="empty__desc">' + esc(desc) + '</div>' : '') +
      (extra || '') + '</div>';
  }
  function pctOf(a, b) { return b > 0 ? (a / b) * 100 : 0; }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  global.BoardUI = {
    icons: ICONS, icon: icon, esc: esc, toast: toast, modal: modal, confirm: confirmDialog,
    download: download, debounce: debounce, delta: delta, statusBadge: statusBadge,
    medallion: medallion, empty: empty, pctOf: pctOf, clamp: clamp
  };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* 同盟战功统计看板 · 应用层 */
(function () {
  'use strict';

  const D = window.BoardData;
  const U = window.BoardUI;
  const C = window.BoardCharts;
  const esc = U.esc;

  const view = document.getElementById('view');
  const state = {
    date: null,
    dashboard: { trend: 'warMerit', activity: 'rising' },
    ranking: { sort: 'warMerit', clan: '', region: '', q: '', page: 1 },
    clan: { sort: 'warMerit' },
    copper: { level: 9, player: '' },
    admin: { tab: 'import', preview: null, error: '', importDate: '', mode: 'insert', success: null, copperFilter: 'all' },
    memberTrend: 'warMerit'
  };
  let chartJobs = [];
  let currentPath = '/dashboard';
  let lastBreakpoint = null;

  D.init();
  state.date = D.latestDate();

  /* ---------------- 小工具 ---------------- */
  function fmtTime(iso) {
    if (!iso) return '--';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '--';
    return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function getDate() {
    if (state.date && D.dates().indexOf(state.date) >= 0) return state.date;
    return D.latestDate();
  }
  function sortCopy(list, fn) { return list.slice().sort(fn); }
  function val(name) { return 'value="' + esc(name) + '"'; }
  function clanTag(name) {
    let h = 0;
    const s = String(name || '');
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    const hue = Math.abs(h) % 360;
    return '<span class="tag tag--clan" style="border-color:hsla(' + hue + ',42%,62%,.32);background:hsla(' + hue + ',42%,55%,.1);color:hsl(' + hue + ',55%,76%)">' + esc(name) + '</span>';
  }
  function statusText(status) {
    return D.statusInfo(status).label;
  }
  function basisLabel(d) {
    return d.changeBasis === 'weekAgo' ? '较上周同日' : d.changeBasis === 'prev' ? '较昨日' : '';
  }
  function pageHead(o) {
    return '<div class="page-head">' +
      '<div class="page-head__icon">' + U.icon(o.icon || 'dashboard', 22) + '</div>' +
      '<div class="page-head__main">' +
      '<h1 class="page-head__title"><span class="gold-text">' + esc(o.title) + '</span></h1>' +
      (o.sub ? '<p class="page-head__sub">' + esc(o.sub) + '</p>' : '') +
      (o.meta ? '<div class="page-head__meta">' + o.meta + '</div>' : '') +
      '</div>' +
      (o.actions ? '<div class="page-head__actions">' + o.actions + '</div>' : '') +
      '</div>';
  }
  function dateField() {
    const dates = D.dates().slice().reverse();
    const sel = getDate();
    return '<div class="field date-field"><span class="field__label">战报日期</span><select class="select" data-filter="date" aria-label="战报日期">' +
      dates.map((d) => '<option value="' + d + '"' + (d === sel ? ' selected' : '') + '>' + d + ' · ' + D.weekday(d) + '</option>').join('') +
      '</select></div>';
  }
  function metricCard(o) {
    return '<div class="metric">' +
      '<div class="metric__top"><span class="metric__label">' + esc(o.label) + '</span><span class="metric__icon">' + U.icon(o.icon, 14) + '</span></div>' +
      '<div class="metric__value">' + o.value + '</div>' +
      '<div class="metric__foot">' + (o.foot || '<span class="metric__sub">' + esc(o.sub || '') + '</span>') + '</div>' +
      (o.spark ? '<div class="metric__spark">' + C.spark(o.spark, o.color) + '</div>' : '') +
      (o.badge ? '<div class="metric__badge">' + o.badge + '</div>' : '') +
      '</div>';
  }
  function queueChart(fn) { chartJobs.push(fn); }
  function flushCharts() {
    const jobs = chartJobs;
    chartJobs = [];
    jobs.forEach((fn) => { try { fn(); } catch (err) { console.error(err); } });
  }
  function navigate(path, replace) {
    const target = '#' + path;
    if (location.hash === target) { render(); return; }
    if (replace) history.replaceState(null, '', target);
    else location.hash = target;
    if (replace) render();
  }
  function parseHash() {
    let raw = location.hash.replace(/^#/, '') || '/dashboard';
    raw = raw.split('?')[0];
    const parts = raw.split('/').filter(Boolean).map((p) => {
      try { return decodeURIComponent(p); } catch (err) { return p; }
    });
    let path = '/' + parts.join('/');
    if (path === '/') path = '/dashboard';
    return { path: path, parts: parts };
  }
  function setActiveNav(path) {
    let key = '/dashboard';
    if (path.indexOf('/ranking') === 0 || path.indexOf('/member') === 0) key = '/ranking';
    else if (path.indexOf('/clan') === 0) key = '/clan';
    else if (path.indexOf('/copper') === 0) key = '/copper';
    else if (path.indexOf('/admin') === 0) key = '/admin';
    document.querySelectorAll('[data-route]').forEach((el) => {
      el.classList.toggle('is-active', el.getAttribute('data-route') === key);
    });
  }
  function updateChrome() {
    const d = getDate();
    const sideDate = document.getElementById('side-date');
    const sideWeek = document.getElementById('side-week');
    const topDate = document.getElementById('top-date');
    if (sideDate) sideDate.textContent = d ? d : '暂无数据';
    if (sideWeek) sideWeek.textContent = d ? D.weekday(d) + ' · ' + D.weekRangeLabel(d) : '导入后自动生成';
    if (topDate) topDate.textContent = d ? D.shortDate(d) : '暂无数据';
  }
  function renderView(html) {
    chartJobs = [];
    view.innerHTML = html;
    updateChrome();
    setActiveNav(currentPath);
    requestAnimationFrame(() => { flushCharts(); afterRender(); });
  }

  /* ---------------- 路由 ---------------- */
  function render() {
    const r = parseHash();
    currentPath = r.path;
    const parts = r.parts;
    if (!D.dates().length && parts[0] !== 'admin') {
      renderWelcome();
      return;
    }
    if (parts[0] === 'ranking') { document.title = '全盟排行 · 九天揽月楼'; return renderRanking(); }
    if (parts[0] === 'clan' && parts[1]) { document.title = parts[1] + ' · 门阀详情'; return renderClanDetail(parts[1]); }
    if (parts[0] === 'clan') { document.title = '门阀排行 · 九天揽月楼'; return renderClans(); }
    if (parts[0] === 'member' && parts[1]) { document.title = parts[1] + ' · 战绩史册'; return renderMember(parts[1]); }
    if (parts[0] === 'copper') { document.title = '铜矿报备 · 九天揽月楼'; return renderCopper(); }
    if (parts[0] === 'admin') {
      document.title = '管理中心 · 九天揽月楼';
      if (parts[1]) state.admin.tab = parts[1];
      return renderAdmin();
    }
    document.title = '同盟战功统计看板 · 九天揽月楼';
    return renderDashboard();
  }

  /* ---------------- 仪表盘 ---------------- */
  function renderDashboard() {
    const date = getDate();
    const d = D.dashboard(date);
    if (!d) return renderWelcome();
    const info = D.statusInfo(d.status);
    const basis = basisLabel(d);
    const daily = (base) => D.dailyLabel(d.status, base);
    const trendMetric = state.dashboard.trend;
    const trendMeta = {
      warMerit: { label: '战功', color: C.COLORS.gold, icon: 'sword' },
      contribution: { label: '贡献', color: C.COLORS.cinnabar, icon: 'coins' },
      assist: { label: '助攻', color: C.COLORS.blue, icon: 'users' }
    }[trendMetric];
    const activeRate = d.totalMembers ? ((d.activeMembers / d.totalMembers) * 100).toFixed(1) : '0.0';
    const stateCount = new Set(d.members.map((m) => m.stateName)).size;
    const ch = D.changes(date);

    const metrics =
      '<div class="metrics metrics--six">' +
      metricCard({
        label: daily('今日战功'), icon: 'sword', value: D.fmt(d.totals.warMeritDaily),
        foot: U.delta(d.changes.warMerit, basis || '暂无对比'),
        spark: d.trend.map((t) => t.warMeritDaily), color: C.COLORS.gold
      }) +
      metricCard({
        label: daily('今日贡献'), icon: 'coins', value: D.fmt(d.totals.contributionDaily),
        foot: U.delta(d.changes.contribution, basis || '暂无对比'),
        spark: d.trend.map((t) => t.contributionDaily), color: C.COLORS.cinnabar
      }) +
      metricCard({
        label: daily('今日助攻'), icon: 'users', value: D.fmt(d.totals.assistDaily),
        foot: U.delta(d.changes.assist, basis || '暂无对比'),
        spark: d.trend.map((t) => t.assistDaily), color: C.COLORS.blue
      }) +
      metricCard({
        label: '活跃成员数', icon: 'activity', value: d.activeMembers.toLocaleString('zh-CN'),
        sub: '/ ' + d.totalMembers + ' 人 · 活跃率 ' + activeRate + '%'
      }) +
      metricCard({
        label: '门阀总数', icon: 'shield', value: d.totalClans.toLocaleString('zh-CN'),
        sub: '覆盖 ' + stateCount + ' 个州'
      }) +
      metricCard({

          '<div class="mini-row__sub">' + esc(it.member.clanName) + '</div></div>' +
          '<span class="mini-row__value">' + (it.growth != null ? '+' + D.fmt(it.growth) : D.fmt(it.member.warMeritDaily)) + '</span></div>').join('')
        : U.empty('flame', '暂无冲榜数据', '需要前一日基线才能计算增长'))
      : (d.inactive.length
        ? d.inactive.map((it, i) =>
          '<div class="mini-row"><span class="mini-row__rank">' + (i + 1) + '</span>' +
          '<div class="mini-row__main"><a class="mini-row__name" href="#/member/' + encodeURIComponent(it.member.name) + '">' + esc(it.member.name) + '</a>' +
          '<div class="mini-row__sub">' + esc(it.member.clanName) + ' · 活跃度 ' + it.member.activityScore.toFixed(1) + '</div></div>' +
          '<span class="badge badge--muted badge--sm">连续 ' + it.days + ' 天</span></div>').join('')

      '<div><div class="card__title">活跃度监测</div><div class="card__sub">' + (state.dashboard.activity === 'rising' ? '战功增长最快的成员' : '连续未出力的成员') + '</div></div>' +
      '<div class="card__actions"><div class="seg seg--plain">' +
      '<button type="button" class="seg__btn' + (state.dashboard.activity === 'rising' ? ' is-active' : '') + '" data-action="activity-tab" data-tab="rising">冲榜</button>' +
      '<button type="button" class="seg__btn' + (state.dashboard.activity === 'inactive' ? ' is-active' : '') + '" data-action="activity-tab" data-tab="inactive">划水</button>' +
      '</div></div></div>' +
      '<div class="list-scroll">' + activityRows + '</div>' +
      (d.rising.length && state.dashboard.activity === 'rising' ? '<div class="card__foot tiny muted">对比口径：' + esc(d.rising[0].basis || '较昨日') + '</div>' : '') +
      '</div>';

    const clanActivityItems = sortCopy(d.clans, (a, b) => b.avgActivityScore - a.avgActivityScore).slice(0, 8)
      .map((c) => ({ label: c.clanName, value: c.avgActivityScore, display: c.avgActivityScore.toFixed(1), unit: '分' }));
    const clanActivityCard =
      '<div class="card card--ornate">' +
      '<div class="card__head"><span class="card__icon card__icon--jade">' + U.icon('activity', 14) + '</span>' +
      '<div><div class="card__title">门阀活跃度均值</div><div class="card__sub">活跃度 = 贡献 30% + 战功 50% + 助攻 20%</div></div></div>' +
      C.hbars(clanActivityItems, { max: 100 }) +
      '</div>';

      { key: 'contributionDaily', label: '贡献' },

    ];
    const leaderRows = leaderDefs.map((def) => {
      const top = d.members.slice().sort((a, b) => b[def.key] - a[def.key])[0];
      if (!top) return '';
      return '<div class="mini-row"><span class="badge badge--gold badge--sm" style="width:38px;justify-content:center">' + def.label + '</span>' +
        '<div class="mini-row__main"><a class="mini-row__name" href="#/member/' + encodeURIComponent(top.name) + '">' + esc(top.name) + '</a>' +
        '<div class="mini-row__sub">' + esc(top.clanName) + '</div></div>' +
        '<span class="mini-row__value">' + D.fmt(top[def.key]) + '</span></div>';
    }).join('');
    const leadersCard =
      '<div class="card card--ornate">' +
      '<div class="card__head"><span class="card__icon card__icon--red">' + U.icon('crown', 14) + '</span>' +
      '<div><div class="card__title">单项榜首</div><div class="card__sub">当日战功 / 贡献 / 助攻</div></div></div>' +
      '<div class="mini-list">' + leaderRows + '</div>' +
      '</div>';

    const changeCard =
      '<div class="card card--ornate">' +
      '<div class="card__head"><span class="card__icon card__icon--blue">' + U.icon('users', 14) + '</span>' +
      '<div><div class="card__title">人员变动</div><div class="card__sub">' + (ch ? '与 ' + ch.prevDate + ' 对比' : '需要至少两天的战报') + '</div></div>' +
      (ch ? '<div class="card__actions"><button type="button" class="btn btn--xs btn--ghost" data-action="view-changes" data-date="' + date + '">查看全部</button></div>' : '') +
      '</div>' +
      (ch
        ? '<div class="change-grid">' +
          '<div class="change-box"><div class="change-box__num change-box__num--up">+' + ch.added.length + '</div><div class="change-box__label">新入成员</div></div>' +
          '<div class="change-box"><div class="change-box__num change-box__num--down">-' + ch.lost.length + '</div><div class="change-box__label">流失成员</div></div>' +
          '<div class="change-box"><div class="change-box__num change-box__num--move">' + ch.transfers.length + '</div><div class="change-box__label">门阀调动</div></div>' +
          '</div>' +
          (ch.added.length || ch.lost.length || ch.transfers.length
            ? '<div class="change-list">' +
              ch.added.slice(0, 3).map((m) => '<span class="change-chip change-chip--up">+ ' + esc(m.name) + '</span>').join('') +
              ch.lost.slice(0, 3).map((m) => '<span class="change-chip change-chip--down">- ' + esc(m.name) + '</span>').join('') +
              ch.transfers.slice(0, 2).map((m) => '<span class="change-chip">' + esc(m.name) + ' → ' + esc(m.to) + '</span>').join('') +
              '</div>'

      '</div>';

    renderView(
      pageHead({
        icon: 'dashboard',
        title: '同盟战功统计看板',
        sub: '九天揽月楼 · 数据快照 · ' + D.weekRangeLabel(date),
        meta: U.statusBadge(d.status) + '<span class="tiny muted">最近更新 ' + fmtTime(d.importedAt) + '</span>',
        actions: dateField() + '<button class="btn btn--gold" type="button" data-action="import" aria-label="导入战报">' + U.icon('upload', 15) + '<span>导入战报</span></button>'
      }) +
      '<div class="stack-gap">' +
      demoNotice + statusNotice +
      metrics +
      '<div class="grid grid--2">' + trendCard + clanBarCard + activityCard + clanActivityCard + '<div class="stack-gap">' + changeCard + leadersCard + '</div>' + '</div>' +
      '<div class="page-foot"><span class="seal">盟</span>数据口径：当日增量 = 今日本周累计 − 昨日本周累计 · 周一自动识别新周</div>' +
      '</div>'
    );

    queueChart(() => {
      const el = document.querySelector('[data-chart="trend"]');
      if (!el) return;
      C.mount(el, C.line, {
        labels: d.trend.map((t) => D.shortDate(t.date)),
        values: d.trend.map((t) => t[trendMetric + 'Daily']),
        color: trendMeta.color,
        name: trendMeta.label,
        height: 238,
        label: trendMeta.label + '走势图'
      });

      const el = document.querySelector('[data-chart="clan-bar"]');
      if (!el) return;

  /* ---------------- 全盟排行 ---------------- */
  function renderRanking() {
    const date = getDate();
    const d = D.day(date);
    if (!d) return renderWelcome();
    const f = state.ranking;
    const sortDefs = [
      { key: 'warMerit', field: 'warMeritDaily', label: '今日战功', daily: true },
      { key: 'contribution', field: 'contributionDaily', label: '今日贡献', daily: true },
      { key: 'assist', field: 'assistDaily', label: '今日助攻', daily: true },
      { key: 'activity', field: 'activityScore', label: '活跃度', daily: true, score: true },
      { key: 'warMeritTotal', field: 'warMeritTotal', label: '战功总量' },
      { key: 'contributionTotal', field: 'contributionTotal', label: '贡献总量' }
    ];
    const sort = sortDefs.find((s) => s.key === f.sort) || sortDefs[0];
    const clans = sortCopy(Array.from(new Set(d.members.map((m) => m.clanName))), (a, b) => a.localeCompare(b, 'zh'));
    const regions = sortCopy(Array.from(new Set(d.members.map((m) => m.stateName))), (a, b) => a.localeCompare(b, 'zh'));
    if (f.clan && clans.indexOf(f.clan) < 0) f.clan = '';
    if (f.region && regions.indexOf(f.region) < 0) f.region = '';
    const q = f.q.trim().toLowerCase();
    let list = d.members.filter((m) => {
      if (f.clan && m.clanName !== f.clan) return false;
      if (f.region && m.stateName !== f.region) return false;
      if (q && m.name.toLowerCase().indexOf(q) < 0 && m.clanName.toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    list = sortCopy(list, (a, b) => (b[sort.field] - a[sort.field]) || a.name.localeCompare(b.name, 'zh'));
    const pageSize = 50;
    const pages = Math.max(1, Math.ceil(list.length / pageSize));
    if (f.page > pages) f.page = pages;
    if (f.page < 1) f.page = 1;
    const pageList = list.slice((f.page - 1) * pageSize, f.page * pageSize);
    const label = sort.daily ? D.dailyLabel(d.status, sort.label) : sort.label;
    const valOf = (m) => sort.score ? m[sort.field].toFixed(1) : D.fmt(m[sort.field]);

    const filters =
      '<div class="card card--flat"><div class="filters">' +
      '<div class="field field--grow"><span class="field__label">搜索成员</span><div class="search-wrap">' + U.icon('search', 15) +
      '<input class="input" id="ranking-search" data-filter="search" type="search" value="' + esc(f.q) + '" placeholder="昵称或门阀…" autocomplete="off"></div></div>' +
      '<div class="field"><span class="field__label">战报日期</span><select class="select" data-filter="date">' +
      D.dates().slice().reverse().map((x) => '<option value="' + x + '"' + (x === date ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' +
      '<div class="field"><span class="field__label">门阀</span><select class="select" data-filter="clan"><option value="">全部门阀</option>' +
      clans.map((c) => '<option value="' + esc(c) + '"' + (c === f.clan ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></div>' +
      '<div class="field"><span class="field__label">州</span><select class="select" data-filter="region"><option value="">全部州</option>' +
      regions.map((r) => '<option value="' + esc(r) + '"' + (r === f.region ? ' selected' : '') + '>' + esc(r) + '</option>').join('') + '</select></div>' +
      '</div>' +
      '<div style="margin-top:12px" class="seg seg--scroll seg--grid3">' +
      sortDefs.map((s) => '<button type="button" class="seg__btn' + (s.key === sort.key ? ' is-active' : '') + '" data-action="rank-sort" data-sort="' + s.key + '">' + (s.daily ? D.dailyLabel(d.status, s.label) : s.label) + '</button>').join('') +
      '</div></div>';

    const rows = pageList.map((m) => {
      const href = '#/member/' + encodeURIComponent(m.name);
      return '<tr>' +
        '<td>' + U.medallion(m.warMeritRank, true) + '</td>' +
        '<td class="tiny muted tabular">#' + m.clanRank + '</td>' +
        '<td><div class="cell-main"><a href="' + href + '">' + esc(m.name) + '</a>' + (m.isNew ? '<span class="badge badge--jade badge--sm">新入</span>' : '') + '</div><div class="cell-sub">' + esc(m.stateName) + '</div></td>' +
        '<td>' + clanTag(m.clanName) + '</td>' +
        '<td class="tiny muted">' + esc(m.stateName) + '</td>' +
        '<td class="num">' + valOf(m) + '</td>' +
        '<td class="num num--muted">' + D.fmt(m.powerValue) + '</td>' +
        '</tr>';
    }).join('');

    const table =
      '<div class="table-wrap desktop-only"><table class="data-table">' +
      '<thead><tr><th>排名</th><th>门阀内</th><th>成员</th><th>门阀</th><th>州</th><th class="right">' + esc(label) + '</th><th class="right">势力值</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      '<div class="table-foot"><span>共 <b class="gold">' + list.length + '</b> 位成员</span>' +
      '<div class="pager"><button class="pager__btn" type="button" data-action="rank-page" data-page="' + (f.page - 1) + '"' + (f.page <= 1 ? ' disabled' : '') + ' aria-label="上一页">' + U.icon('chevronLeft', 15) + '</button>' +
      '<span class="pager__info">第 <b>' + f.page + '</b> / ' + pages + ' 页</span>' +
      '<button class="pager__btn" type="button" data-action="rank-page" data-page="' + (f.page + 1) + '"' + (f.page >= pages ? ' disabled' : '') + ' aria-label="下一页">' + U.icon('chevronRight', 15) + '</button></div></div></div>';

    const cards = pageList.map((m) => {
      const href = '#/member/' + encodeURIComponent(m.name);
      return '<a class="rank-card" href="' + href + '">' +
        U.medallion(m.warMeritRank) +
        '<div class="rank-card__main"><div class="rank-card__name">' + esc(m.name) + (m.isNew ? '<span class="badge badge--jade badge--sm">新入</span>' : '') + '</div>' +
        '<div class="rank-card__meta">' + clanTag(m.clanName) + '<span>' + esc(m.stateName) + '</span></div></div>' +
        '<div class="rank-card__value"><b>' + valOf(m) + '</b><span>' + esc(label) + '</span></div></a>';
    }).join('');

    const mobilePager = '<div class="card card--flat row row--between"><span class="tiny muted">共 ' + list.length + ' 位 · 第 ' + f.page + '/' + pages + ' 页</span>' +
      '<div class="pager"><button class="pager__btn" type="button" data-action="rank-page" data-page="' + (f.page - 1) + '"' + (f.page <= 1 ? ' disabled' : '') + '>' + U.icon('chevronLeft', 15) + '</button>' +
      '<button class="pager__btn" type="button" data-action="rank-page" data-page="' + (f.page + 1) + '"' + (f.page >= pages ? ' disabled' : '') + '>' + U.icon('chevronRight', 15) + '</button></div></div>';

    renderView(
      pageHead({
        icon: 'trophy',
        title: '全盟排行',
        sub: '查看同盟成员战功、贡献与活跃度排名',
        meta: U.statusBadge(d.status) + '<span class="tiny muted">' + D.weekRangeLabel(date) + '</span>'
      }) +
      '<div class="stack-gap">' +
      filters +
      (list.length
        ? '<div class="mobile-list">' + cards + mobilePager + '</div>' + table
        : '<div class="card">' + U.empty('search', '暂无排行数据', '请检查筛选条件或更换日期') + '</div>') +
      '</div>'
    );
  }

  /* ---------------- 门阀排行 ---------------- */
  function renderClans() {
    const date = getDate();
    const d = D.day(date);
    if (!d) return renderWelcome();
    const f = state.clan;
    const sortDefs = [
      { key: 'warMerit', label: '今日战功', daily: true },
      { key: 'contribution', label: '今日贡献', daily: true },
      { key: 'assist', label: '今日助攻', daily: true },
      { key: 'activity', label: '活跃度均值' },
      { key: 'memberCount', label: '成员数' },
      { key: 'warMeritTotal', label: '战功总量' }
    ];
    const sort = sortDefs.find((s) => s.key === f.sort) || sortDefs[0];
    const valueOf = (c) => {
      if (sort.key === 'activity') return c.avgActivityScore;
      if (sort.key === 'memberCount') return c.memberCount;
      if (sort.key === 'contribution') return c.contributionDaily;
      if (sort.key === 'assist') return c.assistDaily;
      if (sort.key === 'warMeritTotal') return c.warMeritTotal;
      return c.warMeritDaily;
    };
    const clans = sortCopy(d.clans, (a, b) => valueOf(b) - valueOf(a)).map((c, i) => Object.assign({}, c, { viewRank: i + 1 }));
    const label = sort.daily ? D.dailyLabel(d.status, sort.label) : sort.label;
    const activeRate = d.totalMembers ? ((d.activeMembers / d.totalMembers) * 100).toFixed(1) : '0.0';

    const cards = clans.map((c) => {
      const value = valueOf(c);
      const display = sort.key === 'activity' ? value.toFixed(1) + ' 分' : sort.key === 'memberCount' ? value + ' 人' : D.fmt(value);
      return '<div class="clan-card">' +
        '<div class="clan-card__head">' + U.medallion(c.viewRank) +
        '<div class="clan-card__title"><div class="clan-card__name">' + esc(c.clanName) + '</div><div class="clan-card__meta">' + c.memberCount + ' 名成员 · ' + esc(c.stateName) + ' · 活跃 ' + c.activeCount + '</div></div>' +
        '<div class="clan-card__value"><b>' + display + '</b><span>' + esc(label) + '</span></div></div>' +
        '<div class="clan-card__stats">' +
        '<div class="clan-card__stat"><em>' + D.dailyLabel(d.status, '今日战功') + '</em><b>' + D.fmt(c.warMeritDaily) + '</b></div>' +
        '<div class="clan-card__stat"><em>' + D.dailyLabel(d.status, '今日贡献') + '</em><b>' + D.fmt(c.contributionDaily) + '</b></div>' +
        '<div class="clan-card__stat"><em>' + D.dailyLabel(d.status, '今日助攻') + '</em><b>' + D.fmt(c.assistDaily) + '</b></div>' +
        '</div>' +
        '<div class="clan-card__bar"><div class="clan-card__bar-head"><span>活跃度均值</span><b>' + c.avgActivityScore.toFixed(1) + ' / 100</b></div>' +
        '<div class="progress"><span style="width:' + Math.min(100, c.avgActivityScore) + '%"></span></div></div>' +
        '<div class="clan-card__foot"><a class="btn btn--sm btn--ghost" href="#/clan/' + encodeURIComponent(c.clanName) + '">查看门阀 ' + U.icon('chevronRight', 14) + '</a></div>' +
        '</div>';
    }).join('');

    renderView(
      pageHead({
        icon: 'shield',
        title: '门阀排行',
        sub: '按门阀汇总战功、贡献、助攻与活跃度',
        meta: U.statusBadge(d.status) + '<span class="tiny muted">' + D.weekRangeLabel(date) + '</span>',
        actions: dateField()
      }) +
      '<div class="stack-gap">' +
      '<div class="metrics">' +
      metricCard({ label: '门阀总数', icon: 'shield', value: String(d.totalClans), sub: '个门阀' }) +
      metricCard({ label: '全盟成员', icon: 'users', value: String(d.totalMembers), sub: '名成员' }) +
      metricCard({ label: '活跃成员', icon: 'activity', value: String(d.activeMembers), sub: '活跃率 ' + activeRate + '%' }) +
      metricCard({ label: D.dailyLabel(d.status, '今日战功'), icon: 'sword', value: D.fmt(d.totals.warMeritDaily), sub: '全盟合计' }) +
      '</div>' +
      '<div class="card card--flat"><div class="seg seg--scroll seg--grid3">' +

  /* ---------------- 铜矿报备 ---------------- */
  function balanceHTML(name, level) {
    const cost = D.copperCost[level] || D.copperCost[9];
    if (!name) {
      return '<div class="tiny muted center" style="padding:16px 6px">输入玩家名字后，显示本周可用战功</div>';
    }
    const bal = D.copperBalance(name);
    if (!bal.found) {
      return '<div class="notice notice--red"><span class="notice__icon">' + U.icon('alert', 16) + '</span><div class="notice__text">最新战报中未找到「' + esc(name) + '」，请确认游戏内角色名与战报一致。</div></div>';
    }
    const remain = bal.available - cost;
    return '<div class="balance">' +
      '<div class="balance__item"><em>本周战功总数</em><b>' + D.fmt(bal.total) + '</b></div>' +
      '<div class="balance__item"><em>本周已兑换 / 待结算</em><b>' + D.fmt(bal.settled + bal.pending) + '</b></div>' +
      '<div class="balance__item"><em>可用余额</em><b>' + D.fmt(bal.available) + '</b></div>' +
      '<div class="balance__item"><em>本次扣除</em><b>' + D.fmt(cost) + '</b></div>' +
      '<div class="balance__item balance__item--wide' + (remain < 0 ? ' balance__item--neg' : '') + '"><em>本次扣除后剩余</em><b>' + D.fmt(remain) + '</b></div>' +
      '</div>' +
      (remain < 0 ? '<div class="field__error" style="margin-top:8px">可用战功不足，无法兑换 ' + level + ' 级矿</div>' : '');
  }
  function reportStatusBadge(status) {
    if (status === 'pending') return '<span class="badge badge--gold">待结算</span>';
    if (status === 'settled') return '<span class="badge badge--jade">已结算</span>';
    return '<span class="badge badge--muted">已撤销</span>';
  }
  function inlineBalance(name, level) {
    const n = String(name || '').trim();
    if (!n) return '';
    const bal = D.copperBalance(n);
    if (!bal.found) return '最新战报中未找到该玩家';
    const cost = D.copperCost[level] || D.copperCost[9];
    return '本周可用 ' + D.fmt(bal.available) + ' · 本次需 ' + D.fmt(cost);
  }

      '</div>' + body + '</div>'

  function adminImport() {
    const preview = state.admin.preview;
    const success = state.admin.success;
    const importDate = state.admin.importDate || (preview && preview.date) || '';
    const existing = importDate && D.day(importDate) ? D.day(importDate) : null;
    const mode = state.admin.mode;
    const logs = D.importLogs().slice(0, 6);

    const successHTML = success
      ? '<div class="notice notice--jade"><span class="notice__icon">' + U.icon('check', 17) + '</span><div class="notice__text"><b>导入成功</b>　' + success.date + ' · ' + success.memberCount + ' 名成员 · ' + success.clanCount + ' 个门阀' + (success.saved ? '' : '（本地存储写入失败，请立即导出备份）') + '</div></div>' +
      '<div class="row" style="margin-top:9px"><a class="btn btn--gold btn--sm" href="#/dashboard">查看仪表盘</a><button class="btn btn--ghost btn--sm" type="button" data-action="pick-csv">继续导入</button></div>'
      : '';

    const errorHTML = state.admin.error
      ? '<div class="notice notice--red"><span class="notice__icon">' + U.icon('alert', 17) + '</span><div class="notice__text">' + esc(state.admin.error) + '</div></div>'
      : '';

    const previewHTML = preview
      ? '<div class="card card--ornate" style="margin-top:14px">' +
        '<div class="card__head"><span class="card__icon">' + U.icon('file', 14) + '</span><div><div class="card__title">战报预览</div><div class="card__sub">确认无误后录入当日快照</div></div></div>' +
        '<div class="preview__row"><span>战报名</span><span class="mono tiny">' + esc(preview.fileName) + '</span></div>' +
        '<div class="preview__row"><span>战报日期</span><span><input class="input" style="height:34px;width:160px;display:inline-block" type="date" data-admin-date value="' + esc(importDate) + '">' +
        '<span class="tiny ' + (preview.dateSource === 'filename' ? 'jade' : 'muted') + '" style="margin-left:8px">' + (preview.dateSource === 'filename' ? '已从文件名识别' : '未识别，请手动选择') + '</span></span></div>' +
        '<div class="preview__stats">' +

  function openImport() {

  function readFile(file) {
    return new Promise((resolve, reject) => {
      const supportsDecoder = typeof TextDecoder === 'function';
      const reader = new FileReader();
      reader.onload = () => {
        try {
          if (!supportsDecoder) return resolve(String(reader.result || ''));
          const buffer = reader.result;
          const bytes = new Uint8Array(buffer);
          if (bytes.length > 1 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
            return resolve(new TextDecoder('utf-16le').decode(buffer));
          }
          if (bytes.length > 1 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
            return resolve(new TextDecoder('utf-16be').decode(buffer));
          }
          try {
            return resolve(new TextDecoder('utf-8', { fatal: true }).decode(buffer));
          } catch (err) {
            // 中文 Excel 另存的 CSV 常见 GBK / GB18030 编码
            try { return resolve(new TextDecoder('gb18030').decode(buffer)); } catch (err2) { return resolve(new TextDecoder('utf-8').decode(buffer)); }
          }
        } catch (err) { reject(err); }
      };
      reader.onerror = () => reject(reader.error || new Error('读取文件失败'));
      if (supportsDecoder) reader.readAsArrayBuffer(file);
      else reader.readAsText(file, 'utf-8');
    });
  }
  async function handleCSVFile(file) {
    if (!file) return;
    if (!/\.csv$/i.test(file.name)) { U.toast('请选择 .csv 格式的战报文件', 'error'); return; }
    if (file.size > 15 * 1024 * 1024) { U.toast('文件过大（超过 15MB），请检查后重试', 'error'); return; }
    let text;
    try { text = await readFile(file); } catch (err) { U.toast('文件读取失败，请重试', 'error'); return; }
    let preview;
    try {
      preview = D.parseCSV(text, file.name);
    } catch (err) {
      state.admin.tab = 'import';
      state.admin.error = err.message || '文件解析失败，请检查文件格式';
      state.admin.preview = null;
      state.admin.success = null;
      if (location.hash !== '#/admin/import') navigate('/admin/import'); else render();
      U.toast(state.admin.error, 'error');
      return;
    }
    state.admin.tab = 'import';
    state.admin.preview = preview;
    state.admin.error = '';
    state.admin.success = null;
    state.admin.importDate = preview.date || '';
    state.admin.mode = state.admin.importDate && D.day(state.admin.importDate) ? 'overwrite' : 'insert';
    if (location.hash !== '#/admin/import') navigate('/admin/import'); else render();
    U.toast('已解析 ' + preview.memberCount + ' 名成员', 'success');
  }
  function confirmImport() {
    const p = state.admin.preview;
    const date = state.admin.importDate;
    if (!p) { U.toast('请先选择 CSV 战报文件', 'error'); return; }
    if (!date) { U.toast('请选择战报日期', 'error'); return; }
    try {
      const res = D.commitImport({ date: date, rows: p.rows, fileName: p.fileName, mode: state.admin.mode });
      if (res.skipped) {
        U.toast('已跳过该日战报', 'info');
        state.admin.preview = null;
        render();
        return;
      }
      state.admin.success = res;
      state.admin.preview = null;
      state.date = date;
      state.ranking.page = 1;
      render();
      U.toast('战报导入成功，共 ' + res.memberCount + ' 名成员', 'success');
      if (!D.saveOk()) U.toast('本地存储写入失败，请立即在「备份与数据」中导出备份', 'error');
    } catch (err) {
      U.toast(err.message || '导入失败', 'error');
    }
  }
  function viewChanges(date) {
    const ch = D.changes(date);
    if (!ch) {
      U.modal({ title: '人员变动 · ' + date, body: '<p class="modal__text">这是第一份战报，暂无前一日数据可供对比。</p>' });
      return;
    }
    const total = ch.added.length + ch.lost.length + ch.transfers.length;
    let body = '<div class="change-grid">' +
      '<div class="change-box"><div class="change-box__num change-box__num--up">+' + ch.added.length + '</div><div class="change-box__label">新入成员</div></div>' +
      '<div class="change-box"><div class="change-box__num change-box__num--down">-' + ch.lost.length + '</div><div class="change-box__label">流失成员</div></div>' +
      '<div class="change-box"><div class="change-box__num change-box__num--move">' + ch.transfers.length + '</div><div class="change-box__label">门阀调动</div></div>' +
      '</div>';
    if (!total && !ch.stateMoves.length) body += '<p class="modal__text" style="margin-top:12px">当天成员与门阀均无变化。</p>';
    if (ch.added.length) body += '<div class="divider"></div><div class="section-title">新入成员</div><div class="change-list">' + ch.added.map((m) => '<span class="change-chip change-chip--up">+ ' + esc(m.name) + ' · ' + esc(m.clanName) + '</span>').join('') + '</div>';
    if (ch.lost.length) body += '<div class="divider"></div><div class="section-title">流失成员</div><div class="change-list">' + ch.lost.map((m) => '<span class="change-chip change-chip--down">- ' + esc(m.name) + ' · ' + esc(m.clanName) + '</span>').join('') + '</div>';
    if (ch.transfers.length) body += '<div class="divider"></div><div class="section-title">门阀调动</div><div class="change-list">' + ch.transfers.map((m) => '<span class="change-chip">' + esc(m.name) + '：' + esc(m.from) + ' → ' + esc(m.to) + '</span>').join('') + '</div>';
    if (ch.stateMoves.length) body += '<div class="divider"></div><div class="section-title">州变动</div><div class="change-list">' + ch.stateMoves.map((m) => '<span class="change-chip">' + esc(m.name) + '：' + esc(m.from) + ' → ' + esc(m.to) + '</span>').join('') + '</div>';
    U.modal({ title: '人员变动 · ' + date + '（对比 ' + ch.prevDate + '）', body: body, wide: true });
  }
  function csvCell(v) {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportRanking() {
    const date = getDate();
    const d = D.day(date);
    if (!d) { U.toast('暂无可导出的战报', 'error'); return; }
    const list = sortCopy(d.members, (a, b) => b.warMeritDaily - a.warMeritDaily);
    const header = ['排名', '成员', '门阀', '州', '势力值', '战功日增', '贡献日增', '助攻日增', '活跃度', '战功总量'];
    const lines = [header.join(',')].concat(list.map((m, i) => [i + 1, m.name, m.clanName, m.stateName, m.powerValue, m.warMeritDaily, m.contributionDaily, m.assistDaily, m.activityScore, m.warMeritTotal].map(csvCell).join(',')));
    U.download('战功排行_' + date + '.csv', '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8');
    U.toast('已导出当日排行 CSV', 'success');
  }
  function downloadTemplate() {
    const lines = [
      '成员,门阀,州,势力值,战功本周,贡献本周,助攻本周,捐献本周',
      '云中月,九天揽月,并州,5200000,860000,120000,60000,30000',
      '北陌,九天揽月,并州,4800000,720000,98000,52000,24000',
      '江左梅郎,龙渊,冀州,5100000,790000,105000,48000,20000'
    ];
    U.download('同盟战报模板.csv', '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8');
    U.toast('模板已下载，可直接用 Excel 打开填写', 'success');
  }
  function weightValues() {
    const out = {};
    document.querySelectorAll('[data-weight-num]').forEach((el) => {
      out[el.getAttribute('data-weight-num')] = Math.max(0, Math.min(100, Number(el.value) || 0));
    });
    return out;
  }
  function refreshWeightSum() {
    const v = weightValues();
    const sum = (v.warMerit || 0) + (v.contribution || 0) + (v.assist || 0);
    const wrap = document.getElementById('weight-sum');
    const label = document.getElementById('weight-sum-value');
    if (label) label.textContent = String(sum);
    if (wrap) wrap.classList.toggle('is-bad', sum !== 100);
  }
  function updateCopperPanel() {
    const input = document.getElementById('copper-player');
    const name = input ? input.value.trim() : state.copper.player;
    state.copper.player = name;
    const checked = document.querySelector('input[name="level"]:checked');
    const level = checked ? Number(checked.value) : state.copper.level;
    state.copper.level = level;
    const box = document.getElementById('copper-balance');
    if (box) box.innerHTML = balanceHTML(name, level);
    const cost = document.getElementById('copper-cost');
    if (cost) cost.textContent = '提交报备 · 扣除 ' + D.fmt(D.copperCost[level]) + ' 战功';
    const inline = document.getElementById('copper-inline');
    if (inline) inline.textContent = inlineBalance(name, level);
  }
  function afterRender() {
    const dz = document.getElementById('dropzone');
    if (dz) {
      dz.addEventListener('click', (e) => {
        if (e.target.closest('[data-action]')) return;
        const input = document.getElementById('csv-file');
        if (input) input.click();
      });
      dz.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          const input = document.getElementById('csv-file');
          if (input) input.click();
        }
      });
      ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => {
        e.preventDefault();
        dz.classList.add('is-drag');
      }));
      ['dragleave', 'dragend'].forEach((ev) => dz.addEventListener(ev, () => dz.classList.remove('is-drag')));
      dz.addEventListener('drop', (e) => {
        e.preventDefault();
        dz.classList.remove('is-drag');
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) handleCSVFile(file);
      });
    }
  }

  /* ---------------- 事件 ---------------- */
  function onClick(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.getAttribute('data-action');
    const ds = target.dataset;
    if (action === 'import' || action === 'pick-csv' || action === 'go-import') { openImport(); return; }
    if (action === 'trend-metric') { state.dashboard.trend = ds.metric; render(); return; }
    if (action === 'activity-tab') { state.dashboard.activity = ds.tab; render(); return; }
    if (action === 'rank-sort') { state.ranking.sort = ds.sort; state.ranking.page = 1; render(); return; }
    if (action === 'clan-sort') { state.clan.sort = ds.sort; render(); return; }
    if (action === 'member-metric') { state.memberTrend = ds.metric; render(); return; }
    if (action === 'rank-page') {
      const p = Number(ds.page);
      if (p >= 1) { state.ranking.page = p; render(); }
      return;
    }
    if (action === 'view-changes') { viewChanges(ds.date); return; }
    if (action === 'view-date') { state.date = ds.date; state.ranking.page = 1; navigate('/dashboard'); return; }
    if (action === 'admin-tab') {
      state.admin.tab = ds.tab;
      if (location.hash !== '#/admin/' + ds.tab) navigate('/admin/' + ds.tab); else render();
      return;
    }
    if (action === 'admin-mode') { state.admin.mode = ds.mode; render(); return; }
    if (action === 'confirm-import') { confirmImport(); return; }
    if (action === 'delete-snapshot') {
      const date = ds.date;
      U.confirm({ title: '删除战报', message: '确定删除 ' + date + ' 的战报快照吗？删除后无法恢复，相关导入记录也会一并移除。', confirmText: '删除', danger: true }).then((ok) => {
        if (!ok) return;
        D.deleteSnapshot(date);
        if (!D.dates().length) state.date = null;
        else if (state.date === date) state.date = D.latestDate();
        render();
        U.toast('已删除 ' + date + ' 的战报', 'success');
      });
      return;
    }
    if (action === 'reset-weights') {
      D.resetWeights();
      render();
      U.toast('已恢复默认权重：战功 50 / 贡献 30 / 助攻 20', 'success');
      return;
    }
    if (action === 'export-json') {
      U.download('同盟战功备份_' + D.todayKey() + '.json', D.exportJSON(), 'application/json');
      U.toast('备份已导出，请妥善保存', 'success');
      return;
    }
    if (action === 'import-json') {
      const input = document.getElementById('json-file');
      if (input) input.click();
      return;
    }
    if (action === 'export-ranking') { exportRanking(); return; }
    if (action === 'download-template') { downloadTemplate(); return; }
    if (action === 'load-demo') {
      U.confirm({ title: '载入演示数据', message: '将用一套演示战报替换当前所有数据（含铜矿报备），方便快速体验。确定继续？', confirmText: '载入演示', danger: true }).then((ok) => {
        if (!ok) return;
        D.loadDemo();
        state.date = D.latestDate();
        state.ranking.page = 1;
        state.admin.success = null;
        navigate('/dashboard');
        U.toast('演示数据已载入', 'success');
      });
      return;
    }
    if (action === 'clear-all') {
      U.confirm({ title: '清空所有数据', message: '将删除全部战报、权重设置与铜矿报备，且无法恢复。建议先导出备份。确定清空？', confirmText: '全部清空', danger: true }).then((ok) => {
        if (!ok) return;
        D.clearAll();
        state.date = null;
        state.admin.preview = null;
        state.admin.success = null;
        navigate('/dashboard');
        U.toast('所有数据已清空', 'success');
      });
      return;
    }
    if (action === 'copper-settle') {
      if (D.settleCopper(ds.id)) { render(); U.toast('报备已结算，战功已扣除', 'success'); }
      return;
    }
    if (action === 'copper-void' || action === 'copper-cancel') {
      U.confirm({ title: '撤销报备', message: '确定撤销这条铜矿报备吗？占用的战功额度会返还。', confirmText: '撤销', danger: true }).then((ok) => {
        if (!ok) return;
        if (D.voidCopper(ds.id)) { render(); U.toast('报备已撤销', 'success'); }
      });
      return;
    }
    if (action === 'copper-filter') { state.admin.copperFilter = ds.filterValue; render(); return; }
  }

  function onChange(e) {
    const filter = e.target.closest('[data-filter]');
    if (filter) {
      const kind = filter.getAttribute('data-filter');
      if (kind === 'date') { state.date = filter.value; state.ranking.page = 1; render(); return; }
      if (kind === 'clan') { state.ranking.clan = filter.value; state.ranking.page = 1; render(); return; }
      if (kind === 'region') { state.ranking.region = filter.value; state.ranking.page = 1; render(); return; }
    }
    if (e.target.matches('[data-admin-date]')) {
      state.admin.importDate = e.target.value;
      state.admin.mode = e.target.value && D.day(e.target.value) ? 'overwrite' : 'insert';
      render();
      return;
    }
    if (e.target.name === 'level') {
      state.copper.level = Number(e.target.value) || 9;
      updateCopperPanel();
    }
  }

  let searchTimer = null;
  let playerTimer = null;
  function onInput(e) {
    if (e.target.id === 'ranking-search') {
      const value = e.target.value;
      const pos = e.target.selectionStart;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.ranking.q = value;
        state.ranking.page = 1;
        render();
        const input = document.getElementById('ranking-search');
        if (input) { input.focus(); try { input.setSelectionRange(pos, pos); } catch (err) { /* ignore */ } }
      }, 240);
      return;
    }
    if (e.target.id === 'copper-player') {
      const value = e.target.value;
      clearTimeout(playerTimer);
      playerTimer = setTimeout(() => {
        state.copper.player = value.trim();
        updateCopperPanel();
      }, 260);
      return;
    }
    const rangeKey = e.target.getAttribute('data-weight-range');
    if (rangeKey) {
      const num = document.querySelector('[data-weight-num="' + rangeKey + '"]');
      if (num) num.value = e.target.value;
      refreshWeightSum();
      return;
    }
    const numKey = e.target.getAttribute('data-weight-num');
    if (numKey) {
      const range = document.querySelector('[data-weight-range="' + numKey + '"]');
      if (range) range.value = e.target.value;
      refreshWeightSum();
    }
  }

  function onSubmit(e) {
    if (e.target.id === 'copper-form') {
      e.preventDefault();
      const data = new FormData(e.target);
      try {
        const rec = D.addCopper({
          player: data.get('player'),
          coordinate: data.get('coordinate'),
          level: data.get('level'),
          note: data.get('note')
        });
        state.copper.player = String(data.get('player') || '').trim();
        state.copper.level = Number(data.get('level')) === 10 ? 10 : 9;
        render();
        U.toast('报备成功，结算后扣除 ' + D.fmt(rec.deducted) + ' 战功', 'success');
      } catch (err) {
        U.toast(err.message || '提交失败，请重试', 'error');
      }
      return;
    }
    if (e.target.id === 'weights-form') {
      e.preventDefault();
      const v = weightValues();
      const sum = v.warMerit + v.contribution + v.assist;
      if (sum !== 100) { U.toast('三项权重之和必须为 100%，当前为 ' + sum + '%', 'error'); return; }
      try {
        D.setWeights(v);
        render();
        U.toast('活跃度权重已保存，排行已重新计算', 'success');
      } catch (err) {
        U.toast(err.message || '保存失败', 'error');
      }
    }
  }

  function setupFileInputs() {
    const csv = document.getElementById('csv-file');
    if (csv) {
      csv.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        handleCSVFile(file);
      });
    }
    const json = document.getElementById('json-file');
    if (json) {
      json.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        readFile(file).then((text) => {
          U.confirm({ title: '导入备份', message: '将用备份文件替换当前全部战报、权重与铜矿记录，确定继续？', confirmText: '导入备份', danger: true }).then((ok) => {
            if (!ok) return;
            try {
              const res = D.importJSON(text);
              state.date = D.latestDate();
              state.ranking.page = 1;
              state.admin.preview = null;
              state.admin.success = null;
              navigate('/dashboard');
              U.toast('备份导入成功，共 ' + res.dates + ' 天战报', 'success');
            } catch (err) {
              U.toast(err.message || '备份导入失败', 'error');
            }
          });
        }).catch(() => U.toast('读取备份文件失败', 'error'));
      });
    }
  }

  /* ---------------- 初始化 ---------------- */
  function init() {
    document.querySelectorAll('[data-icon]').forEach((el) => {
      el.innerHTML = U.icon(el.getAttribute('data-icon'), 18);
    });
    if (!location.hash) { try { history.replaceState(null, '', '#/dashboard'); } catch (err) { location.hash = '#/dashboard'; } }
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('submit', onSubmit);
    window.addEventListener('hashchange', () => {
      render();
      try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (err) { /* ignore */ }
    });
    setupFileInputs();
    state.date = D.latestDate();
    render();
    if (!D.storageAvailable()) {
      setTimeout(() => U.toast('浏览器禁止本地存储，数据仅在本次打开有效，请及时在管理中心导出备份', 'error'), 700);
    }
  }

  init();
})();

</script>
</body>
</html>
